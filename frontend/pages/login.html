<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>登入 - 社團平台</title>
    <link rel="stylesheet" href="../css/styles.css">
    <style>
        .auth-layout {
            display: flex;
            height: calc(100vh - 64px);
            overflow: hidden;
            background: var(--page-bg);
        }
        .auth-carousel {
            flex: 0 0 60%;
            overflow: hidden;
            position: relative;
            display: flex;
            gap: 1rem;
            padding: 1.5rem 1.25rem;
            background: var(--surface);
            border-right: 1px solid var(--border);
        }
        .auth-carousel__fade {
            position: absolute;
            inset: 0;
            z-index: 2;
            pointer-events: none;
            background: linear-gradient(to bottom,
                var(--surface) 0%, transparent 14%,
                transparent 86%, var(--surface) 100%);
        }
        .auth-form-side {
            flex: 1;
            display: flex;
            align-items: safe center;
            justify-content: center;
            padding: 1rem 2rem;
            overflow-y: auto;
            scrollbar-width: none;
        }
        .auth-form-side::-webkit-scrollbar { display: none; }
        .auth-form-side .card {
            width: 100%;
            max-width: 380px;
            background: transparent;
            border: none;
            box-shadow: none;
            border-radius: 0;
            padding: 0;
            margin-bottom: 0;
        }
        .auth-form-side .card:hover { transform: none; box-shadow: none; border-color: transparent; }
        .auth-form-side .form-group { margin-bottom: 0.9rem; }
        @media (max-width: 768px) {
            .auth-form-side .card {
                background: var(--surface);
                border: 1px solid var(--color-border-light);
                box-shadow: 0 1px 4px rgba(26,23,20,.06);
                border-radius: 1rem;
                padding: 1.5rem;
            }
        }
        .logo-col {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 0.85rem;
            animation-timing-function: linear;
            animation-iteration-count: infinite;
        }
        .logo-col--down { animation-name: ac-down; animation-duration: 30s; }
        .logo-col--up   { animation-name: ac-up;   animation-duration: 36s; }
        @keyframes ac-down {
            from { transform: translateY(0); }
            to   { transform: translateY(-50%); }
        }
        @keyframes ac-up {
            from { transform: translateY(-50%); }
            to   { transform: translateY(0); }
        }
        .logo-item {
            width: 100%;
            aspect-ratio: 1;
            border-radius: 0.875rem;
            background: var(--surface-subtle);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            font-weight: 700;
            font-size: 1.5rem;
            color: var(--brand);
            flex-shrink: 0;
        }
        .logo-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
        @media (max-width: 768px) {
            .auth-carousel { display: none; }
            .auth-form-side { flex: 1; }
        }
    </style>
</head>

<body>
    <header>
        <nav>
            <a href="../index.html" class="logo">輔大社團活動資訊系統<span class="logo__sub">FJCU CLUB ACTIVITY INFORMATION SYSTEM</span></a>
            <ul class="nav-links">
                <li><a href="../index.html">首頁</a></li>
                <li><a href="club-list.html">社團</a></li>
                <li><a href="events.html">活動</a></li>
                <li><a href="qa.html">提問</a></li>
            </ul>
            <div class="nav-right">
                <button id="guest-theme-toggle" class="guest-theme-toggle" type="button" title="切換為淺色模式" aria-label="切換為淺色模式"></button>
            </div>
        </nav>
    </header>

    <div class="auth-layout">
        <div class="auth-carousel" id="auth-carousel" aria-hidden="true">
            <div class="auth-carousel__fade"></div>
            <div class="logo-col logo-col--down" id="logo-col-1"></div>
            <div class="logo-col logo-col--up"   id="logo-col-2"></div>
        </div>
        <div class="auth-form-side">
            <div class="card">
                <div style="text-align: center; margin-bottom: 1.25rem;">
                    <h1 style="font-size: 1.75rem; margin-bottom: 0.35rem;">登入</h1>
                    <p style="color: var(--text-light);">歡迎回到社團平台</p>
                </div>

                <div id="alert-container"></div>

                <form id="login-form">
                    <div class="form-group">
                        <label for="email">郵箱</label>
                        <input type="email" id="email" name="email" required>
                    </div>

                    <div class="form-group">
                        <label for="password">密碼</label>
                        <div class="password-field">
                            <input type="password" id="password" name="password" required>
                            <button type="button" class="password-toggle" data-toggle-password="password" aria-label="Show password">Show</button>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary" style="width: 100%;">登入</button>
                </form>

                <div id="google-signin-section" style="margin-top:0.75rem;">
                    <div style="display:flex; align-items:center; gap:0.5rem; margin:0.75rem 0;">
                        <div style="flex:1; height:1px; background:var(--border);"></div>
                        <span style="font-size:0.8rem; color:var(--text-muted); white-space:nowrap;">或使用 Google 登入</span>
                        <div style="flex:1; height:1px; background:var(--border);"></div>
                    </div>
                    <button id="google-signin-btn" type="button" class="btn btn-secondary" style="width:100%; display:flex; align-items:center; justify-content:center; gap:0.5rem;"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>以 Google 帳號登入</button>
                </div>

                <div style="text-align: center; margin-top: 1.5rem;">
                    <p>沒有帳號？<a href="register.html" style="color: var(--primary-color); text-decoration: none;">立即註冊</a></p>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/main.js?v=20260510"></script>
    <script>
        FormUtils.bindPasswordToggles();

        async function initLogoCarousel() {
            try {
                const res = await APIClient.get('clubs.php');
                const clubs = (res.success && res.data && res.data.clubs) ? res.data.clubs : [];
                if (!clubs.length) return;

                for (let i = clubs.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [clubs[i], clubs[j]] = [clubs[j], clubs[i]];
                }

                const cols = [
                    document.getElementById('logo-col-1'),
                    document.getElementById('logo-col-2')
                ];

                cols.forEach((col, ci) => {
                    const pool = clubs.filter((_, i) => i % 2 === ci);
                    const fill = pool.length < 6
                        ? Array.from({ length: Math.ceil(6 / pool.length) }, () => pool).flat()
                        : pool;
                    const double = [...fill, ...fill];
                    col.innerHTML = double.map(club => {
                        const initial = PageUtils.escapeHtml((club.club_name || '社').charAt(0));
                        if (club.logo_path) {
                            const url = PageUtils.escapeAttribute(PageUtils.resolveMediaUrl(club.logo_path));
                            const name = PageUtils.escapeAttribute(club.club_name || '');
                            return `<div class="logo-item" data-initial="${initial}"><img src="${url}" alt="${name}" loading="lazy"></div>`;
                        }
                        return `<div class="logo-item">${initial}</div>`;
                    }).join('');
                    col.querySelectorAll('.logo-item img').forEach(img => {
                        img.addEventListener('error', function () {
                            this.closest('.logo-item').textContent = this.closest('.logo-item').dataset.initial || '社';
                        });
                    });
                });
            } catch (e) { /* carousel is decorative — fail silently */ }
        }

        initLogoCarousel();

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const submitBtn = e.target.querySelector('button[type="submit"]');
            if (submitBtn.disabled) return;

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            if (!Validator.validateEmail(email)) {
                PageUtils.showAlert('請輸入有效的郵箱', 'error');
                return;
            }

            if (!Validator.validatePassword(password)) {
                PageUtils.showAlert('密碼至少需要6個字符', 'error');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = '登入中…';

            try {
                const response = await APIClient.post('auth.php?action=login', {
                    email,
                    password
                });

                if (response.success) {
                    StorageUtils.setUser(response.data);
                    PageUtils.showAlert('登入成功，正在重定向...', 'success');
                    setTimeout(() => {
                        const role = response.data.role;
                        const canManageClubs = Boolean(response.data.can_manage_clubs);
                        if (role === 'platform_admin') {
                            window.location.href = 'admin-users.html';
                        } else if (canManageClubs) {
                            window.location.href = 'club-admin-club-manage.html?v=20260508a';
                        } else {
                            window.location.href = '../index.html';
                        }
                    }, 1000);
                } else {
                    PageUtils.showAlert(response.message, 'error');
                    submitBtn.disabled = false;
                    submitBtn.textContent = '登入';
                }
            } catch (error) {
                console.error('Error:', error);
                PageUtils.showAlert('登入失敗，請稍後重試', 'error');
                submitBtn.disabled = false;
                submitBtn.textContent = '登入';
            }
        });
    </script>
    <script>
    (function () {
        'use strict';

        async function initGoogleSignIn() {
            let clientId;
            try {
                const res = await APIClient.get('oauth.php?action=google_client_id');
                if (!res || !res.success || !res.data || !res.data.client_id) {
                    document.getElementById('google-signin-section').style.display = 'none';
                    return;
                }
                clientId = res.data.client_id;
            } catch (e) {
                document.getElementById('google-signin-section').style.display = 'none';
                return;
            }

            await new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = 'https://accounts.google.com/gsi/client';
                script.async = true;
                script.defer = true;
                script.onload = resolve;
                script.onerror = reject;
                document.head.appendChild(script);
            });

            google.accounts.id.initialize({
                client_id: clientId,
                callback: handleGoogleCallback,
                ux_mode: 'popup',
                cancel_on_tap_outside: true,
            });

            document.getElementById('google-signin-btn').addEventListener('click', function () {
                google.accounts.id.prompt();
            });

            // section already visible — no action needed
        }

        async function handleGoogleCallback(googleResponse) {
            const credential = googleResponse.credential;
            if (!credential) {
                PageUtils.showAlert('Google 登入失敗，請重試', 'error');
                return;
            }

            const passwordSubmitBtn = document.querySelector('#login-form button[type="submit"]');
            if (passwordSubmitBtn) {
                passwordSubmitBtn.disabled = true;
                passwordSubmitBtn.textContent = '登入中…';
            }

            try {
                const response = await APIClient.post('oauth.php?action=google_verify', { credential });

                if (response && response.success) {
                    StorageUtils.setUser(response.data);
                    PageUtils.showAlert('登入成功，正在重定向...', 'success');
                    setTimeout(() => {
                        const role = response.data.role;
                        const canManageClubs = Boolean(response.data.can_manage_clubs);
                        if (role === 'platform_admin') {
                            window.location.href = 'admin-users.html';
                        } else if (canManageClubs) {
                            window.location.href = 'club-admin-club-manage.html?v=20260508a';
                        } else {
                            window.location.href = '../index.html';
                        }
                    }, 1000);
                } else {
                    const msg = (response && response.message) ? response.message : 'Google 登入失敗，請重試';
                    PageUtils.showAlert(msg, 'error');
                    if (passwordSubmitBtn) {
                        passwordSubmitBtn.disabled = false;
                        passwordSubmitBtn.textContent = '登入';
                    }
                }
            } catch (err) {
                console.error('Google OAuth error:', err);
                PageUtils.showAlert('Google 登入失敗，請稍後重試', 'error');
                if (passwordSubmitBtn) {
                    passwordSubmitBtn.disabled = false;
                    passwordSubmitBtn.textContent = '登入';
                }
            }
        }

        initGoogleSignIn().catch(() => {});
    }());
    </script>
</body>

</html>
