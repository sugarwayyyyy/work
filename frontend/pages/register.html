<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>註冊 - 社團平台</title>
    <link rel="stylesheet" href="../css/styles.css?v=20260530">
    <link rel="stylesheet" href="../css/auth-pages.css">
    <style>
        .auth-form-side .card { max-width: 420px; }
        .auth-form-side .form-group { margin-bottom: 0.65rem; }
    </style>
</head>

<body>
    <header>
        <nav>
            <a href="../index.html" class="logo">輔大社團活動資訊系統<span class="logo__sub">FJCU CLUB ACTIVITY INFORMATION SYSTEM</span></a>
            <ul class="nav-links">
                <li><a href="../index.html">首頁</a></li>
                <li><a href="club-list.html">社團</a></li>
                <li><a href="events.html">活動</a></li>
                <li><a href="qa.html">提問</a></li>
            </ul>
            <div class="nav-right">
                <button id="guest-theme-toggle" class="guest-theme-toggle" type="button" title="切換為淺色模式" aria-label="切換為淺色模式"></button>
            </div>
        </nav>
    </header>

    <div class="auth-layout">
        <div class="auth-carousel" id="auth-carousel" aria-hidden="true">
            <div class="auth-carousel__fade"></div>
            <div class="logo-col logo-col--down" id="logo-col-1"></div>
            <div class="logo-col logo-col--up"   id="logo-col-2"></div>
        </div>
        <div class="auth-form-side">
            <div class="card">
                <div style="text-align: center; margin-bottom: 1.25rem;">
                    <h1 style="font-size: 1.75rem; margin-bottom: 0.35rem;">建立帳號</h1>
                    <p style="color: var(--text-light);">加入社團平台社群</p>
                </div>

                <div id="alert-container"></div>

                <form id="register-form">
                    <div class="form-group">
                        <label for="name">姓名</label>
                        <input type="text" id="name" name="name" required>
                    </div>

                    <div class="form-group">
                        <label for="student_id">學號（選填）</label>
                        <input type="text" id="student_id" name="student_id">
                    </div>

                    <div class="form-group">
                        <label for="email">郵箱</label>
                        <input type="email" id="email" name="email" required>
                    </div>

                    <div class="form-group">
                        <label for="password">密碼</label>
                        <div class="password-field">
                            <input type="password" id="password" name="password" required>
                            <button type="button" class="password-toggle" data-toggle-password="password" aria-label="Show password">Show</button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="confirm_password">確認密碼</label>
                        <div class="password-field">
                            <input type="password" id="confirm_password" name="confirm_password" required>
                            <button type="button" class="password-toggle" data-toggle-password="confirm_password" aria-label="Show password">Show</button>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary" style="width: 100%;">建立帳號</button>
                </form>

                <div id="google-signin-section" style="margin-top:0.75rem;">
                    <div style="display:flex; align-items:center; gap:0.5rem; margin:0.75rem 0;">
                        <div style="flex:1; height:1px; background:var(--border);"></div>
                        <span style="font-size:0.8rem; color:var(--text-muted); white-space:nowrap;">或使用 Google 帳號</span>
                        <div style="flex:1; height:1px; background:var(--border);"></div>
                    </div>
                    <button id="google-signin-btn" type="button" class="btn btn-secondary" style="width:100%; display:flex; align-items:center; justify-content:center; gap:0.5rem;"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>以 Google 帳號註冊</button>
                </div>

                <div style="text-align: center; margin-top: 1.5rem;">
                    <p>已有帳號？<a href="login.html" style="color: var(--primary-color); text-decoration: none;">登入</a></p>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/main.js?v=20260603c"></script>
    <script src="../js/auth-pages.js?v=20260528"></script>
    <script>
        FormUtils.bindPasswordToggles();
        initLogoCarousel();
        initGoogleOAuth({
            formSelector: '#register-form',
            loadingText: '處理中…',
            failText: '建立帳號',
            onSuccess: (data) => {
                const role = data.role;
                const canManageClubs = Boolean(data.can_manage_clubs);
                if (role === 'platform_admin') window.location.href = 'admin-users.html';
                else if (canManageClubs) window.location.href = 'club-admin-club-manage.html?v=20260508a';
                else window.location.href = '../index.html';
            }
        });

        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const name = document.getElementById('name').value;
            const student_id = document.getElementById('student_id').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirm_password = document.getElementById('confirm_password').value;

            if (!Validator.validateRequired(name)) {
                PageUtils.showAlert('請輸入姓名', 'error');
                return;
            }

            if (!Validator.validateEmail(email)) {
                PageUtils.showAlert('請輸入有效的郵箱', 'error');
                return;
            }

            if (!Validator.validatePassword(password)) {
                PageUtils.showAlert('密碼至少需要6個字符', 'error');
                return;
            }

            if (password !== confirm_password) {
                PageUtils.showAlert('兩次輸入的密碼不一致', 'error');
                return;
            }

            try {
                const response = await APIClient.post('auth.php?action=register', { name, student_id, email, password });

                if (response.success) {
                    PageUtils.showAlert('註冊成功，正在重定向…', 'success');
                    setTimeout(() => { window.location.href = 'login.html'; }, 1000);
                } else {
                    PageUtils.showAlert(response.message, 'error');
                }
            } catch (error) {
                console.error('Error:', error);
                PageUtils.showAlert('註冊失敗，請稍後重試', 'error');
            }
        });
    </script>
</body>

</html>
