<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>註冊 - 社團平台</title>
    <link rel="stylesheet" href="../css/styles.css">
    <style>
        .auth-layout {
            display: flex;
            height: calc(100vh - 64px);
            overflow: hidden;
            background: var(--page-bg);
        }
        .auth-carousel {
            flex: 0 0 60%;
            overflow: hidden;
            position: relative;
            display: flex;
            gap: 1rem;
            padding: 1.5rem 1.25rem;
            background: var(--surface);
            border-right: 1px solid var(--border);
        }
        .auth-carousel__fade {
            position: absolute;
            inset: 0;
            z-index: 2;
            pointer-events: none;
            background: linear-gradient(to bottom,
                var(--surface) 0%, transparent 14%,
                transparent 86%, var(--surface) 100%);
        }
        .auth-form-side {
            flex: 1;
            display: flex;
            align-items: safe center;
            justify-content: center;
            padding: 1rem 2rem;
            overflow-y: auto;
            scrollbar-width: none;
        }
        .auth-form-side::-webkit-scrollbar { display: none; }
        .auth-form-side .card {
            width: 100%;
            max-width: 420px;
            background: transparent;
            border: none;
            box-shadow: none;
            border-radius: 0;
            padding: 0;
            margin-bottom: 0;
        }
        .auth-form-side .card:hover { transform: none; box-shadow: none; border-color: transparent; }
        .auth-form-side .form-group { margin-bottom: 0.65rem; }
        @media (max-width: 768px) {
            .auth-form-side .card {
                background: var(--surface);
                border: 1px solid var(--color-border-light);
                box-shadow: 0 1px 4px rgba(26,23,20,.06);
                border-radius: 1rem;
                padding: 1.5rem;
            }
        }
        .logo-col {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 0.85rem;
            animation-timing-function: linear;
            animation-iteration-count: infinite;
        }
        .logo-col--down { animation-name: ac-down; animation-duration: 30s; }
        .logo-col--up   { animation-name: ac-up;   animation-duration: 36s; }
        @keyframes ac-down {
            from { transform: translateY(0); }
            to   { transform: translateY(-50%); }
        }
        @keyframes ac-up {
            from { transform: translateY(-50%); }
            to   { transform: translateY(0); }
        }
        .logo-item {
            width: 100%;
            aspect-ratio: 1;
            border-radius: 0.875rem;
            background: var(--surface-subtle);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            font-weight: 700;
            font-size: 1.5rem;
            color: var(--brand);
            flex-shrink: 0;
        }
        .logo-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
        @media (max-width: 768px) {
            .auth-carousel { display: none; }
            .auth-form-side { flex: 1; }
        }
    </style>
</head>

<body>
    <header>
        <nav>
            <a href="../index.html" class="logo">輔大社團活動資訊系統<span class="logo__sub">FJCU CLUB ACTIVITY INFORMATION SYSTEM</span></a>
            <ul class="nav-links">
                <li><a href="../index.html">首頁</a></li>
                <li><a href="club-list.html">社團</a></li>
                <li><a href="events.html">活動</a></li>
                <li><a href="qa.html">提問</a></li>
            </ul>
            <div class="nav-right">
                <button id="guest-theme-toggle" class="guest-theme-toggle" type="button" title="切換為淺色模式" aria-label="切換為淺色模式"></button>
            </div>
        </nav>
    </header>

    <div class="auth-layout">
        <div class="auth-carousel" id="auth-carousel" aria-hidden="true">
            <div class="auth-carousel__fade"></div>
            <div class="logo-col logo-col--down" id="logo-col-1"></div>
            <div class="logo-col logo-col--up"   id="logo-col-2"></div>
        </div>
        <div class="auth-form-side">
            <div class="card">
                <div style="text-align: center; margin-bottom: 1.25rem;">
                    <h1 style="font-size: 1.75rem; margin-bottom: 0.35rem;">建立帳號</h1>
                    <p style="color: var(--text-light);">加入社團平台社群</p>
                </div>

                <div id="alert-container"></div>

                <form id="register-form">
                    <div class="form-group">
                        <label for="name">姓名</label>
                        <input type="text" id="name" name="name" required>
                    </div>

                    <div class="form-group">
                        <label for="student_id">學號（選填）</label>
                        <input type="text" id="student_id" name="student_id">
                    </div>

                    <div class="form-group">
                        <label for="email">郵箱</label>
                        <input type="email" id="email" name="email" required>
                    </div>

                    <div class="form-group">
                        <label for="password">密碼</label>
                        <div class="password-field">
                            <input type="password" id="password" name="password" required>
                            <button type="button" class="password-toggle" data-toggle-password="password" aria-label="Show password">Show</button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="confirm_password">確認密碼</label>
                        <div class="password-field">
                            <input type="password" id="confirm_password" name="confirm_password" required>
                            <button type="button" class="password-toggle" data-toggle-password="confirm_password" aria-label="Show password">Show</button>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary" style="width: 100%;">建立帳號</button>
                </form>

                <div style="text-align: center; margin-top: 1.5rem;">
                    <p>已有帳號？<a href="login.html" style="color: var(--primary-color); text-decoration: none;">登入</a></p>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/main.js?v=20260510"></script>
    <script>
        FormUtils.bindPasswordToggles();

        async function initLogoCarousel() {
            try {
                const res = await APIClient.get('clubs.php');
                const clubs = (res.success && res.data && res.data.clubs) ? res.data.clubs : [];
                if (!clubs.length) return;

                const cols = [
                    document.getElementById('logo-col-1'),
                    document.getElementById('logo-col-2')
                ];

                cols.forEach((col, ci) => {
                    const pool = clubs.filter((_, i) => i % 2 === ci);
                    const fill = pool.length < 6
                        ? Array.from({ length: Math.ceil(6 / pool.length) }, () => pool).flat()
                        : pool;
                    const double = [...fill, ...fill];
                    col.innerHTML = double.map(club => {
                        const initial = PageUtils.escapeHtml((club.club_name || '社').charAt(0));
                        if (club.logo_path) {
                            const url = PageUtils.escapeAttribute(PageUtils.resolveMediaUrl(club.logo_path));
                            const name = PageUtils.escapeAttribute(club.club_name || '');
                            return `<div class="logo-item" data-initial="${initial}"><img src="${url}" alt="${name}" loading="lazy"></div>`;
                        }
                        return `<div class="logo-item">${initial}</div>`;
                    }).join('');
                    col.querySelectorAll('.logo-item img').forEach(img => {
                        img.addEventListener('error', function () {
                            this.closest('.logo-item').textContent = this.closest('.logo-item').dataset.initial || '社';
                        });
                    });
                });
            } catch (e) { /* carousel is decorative — fail silently */ }
        }

        initLogoCarousel();

        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const name = document.getElementById('name').value;
            const student_id = document.getElementById('student_id').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirm_password = document.getElementById('confirm_password').value;

            if (!Validator.validateRequired(name)) {
                PageUtils.showAlert('請輸入姓名', 'error');
                return;
            }

            if (!Validator.validateEmail(email)) {
                PageUtils.showAlert('請輸入有效的郵箱', 'error');
                return;
            }

            if (!Validator.validatePassword(password)) {
                PageUtils.showAlert('密碼至少需要6個字符', 'error');
                return;
            }

            if (password !== confirm_password) {
                PageUtils.showAlert('兩次輸入的密碼不一致', 'error');
                return;
            }

            try {
                const response = await APIClient.post('auth.php?action=register', {
                    name,
                    student_id,
                    email,
                    password
                });

                if (response.success) {
                    PageUtils.showAlert('註冊成功，正在重定向…', 'success');
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 1000);
                } else {
                    PageUtils.showAlert(response.message, 'error');
                }
            } catch (error) {
                console.error('Error:', error);
                PageUtils.showAlert('註冊失敗，請稍後重試', 'error');
            }
        });
    </script>
</body>

</html>
