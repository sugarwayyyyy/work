<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>活動探索 - 校園社團平台</title>
    <link rel="stylesheet" href="../css/styles.css?v=20260530">
    <link rel="stylesheet" href="../css/events.css">
    <link rel="stylesheet" href="../css/home.css">
</head>

<body>
    <header>
        <nav>
            <a href="../index.html" class="logo">輔大社團活動資訊系統<span class="logo__sub">FJCU CLUB ACTIVITY INFORMATION SYSTEM</span></a>
            <ul class="nav-links">
                <li><a href="../index.html">首頁</a></li>
                <li><a href="club-list.html">社團</a></li>
                <li><a href="events.html" class="active">活動</a></li>
                <li><a href="qa.html">提問</a></li>
            </ul>
            <div class="nav-right">
                <button id="login-btn" class="btn btn-primary btn-sm" onclick="window.location.href = 'login.html'">登入</button>
                <button id="logout-btn" class="btn btn-secondary btn-sm" onclick="handleLogout()" style="display: none;">登出</button>
                <span id="user-dropdown" style="display: none;"></span>
            </div>
        </nav>
    </header>

    <div id="alert-container"></div>

    <div class="event-list-page">
        <div class="container event-list-container">

            <!-- 上方篩選卡（全寬） -->
            <div class="event-filter-card filter-card">
                <div class="filter-card__body">

                    <!-- 基本搜尋列（永遠顯示） -->
                    <div class="event-filter-topbar">
                        <div class="filter-field event-filter-keyword">
                            <input type="text" id="event-search" placeholder="輸入活動名稱或關鍵字…">
                        </div>
                        <button type="button" class="btn btn-primary btn-sm" onclick="loadEvents()">篩選</button>
                        <button type="button" class="btn btn-secondary btn-sm" onclick="resetFilters()">重製</button>
                        <button type="button" id="advanced-toggle-btn" class="event-filter-toggle-btn" aria-expanded="false" aria-controls="event-advanced-filters">
                            進階篩選 <span class="toggle-arrow">&#9660;</span>
                        </button>
                    </div>

                    <!-- 工具列：狀態 chip（位置與 QA 一致） -->
                    <div class="event-filter-toolbar">
                        <div class="event-filter-toolbar__status">
                            <span class="event-filter-toolbar__label">活動狀態</span>
                            <div id="event-filters" class="chip-cloud"></div>
                        </div>
                    </div>

                    <!-- 進階篩選（預設隱藏） -->
                    <div id="event-advanced-filters" class="event-advanced-filters" aria-hidden="true">
                        <div class="event-filter-grid event-filter-grid--advanced">
                            <!-- 社團類別 -->
                            <div class="filter-field">
                                <label for="club-category-filter">社團類別</label>
                                <select id="club-category-filter">
                                    <option value="">全部類別</option>
                                </select>
                            </div>

                            <!-- 社團 -->
                            <div class="filter-field">
                                <label for="club-filter">社團</label>
                                <select id="club-filter" disabled>
                                    <option value="">請先選擇類別</option>
                                </select>
                            </div>

                            <!-- 報名開始 -->
                            <div class="filter-field">
                                <label>報名開始（起）</label>
                                <input type="hidden" id="reg-start-from">
                                <div class="event-datetime-group">
                                    <input type="date" id="reg-start-from-date">
                                    <select id="reg-start-from-hour"></select>
                                    <select id="reg-start-from-minute">
                                        <option value="00">整點</option>
                                        <option value="30">半點</option>
                                    </select>
                                </div>
                            </div>

                            <!-- 報名截止 -->
                            <div class="filter-field">
                                <label>報名截止（迄）</label>
                                <input type="hidden" id="deadline-to">
                                <div class="event-datetime-group">
                                    <input type="date" id="deadline-to-date">
                                    <select id="deadline-to-hour"></select>
                                    <select id="deadline-to-minute">
                                        <option value="00">整點</option>
                                        <option value="30">半點</option>
                                    </select>
                                </div>
                            </div>

                            <!-- 活動開始 -->
                            <div class="filter-field">
                                <label>活動開始（起）</label>
                                <input type="hidden" id="event-start-from">
                                <div class="event-datetime-group">
                                    <input type="date" id="event-start-from-date">
                                    <select id="event-start-from-hour"></select>
                                    <select id="event-start-from-minute">
                                        <option value="00">整點</option>
                                        <option value="30">半點</option>
                                    </select>
                                </div>
                            </div>

                            <!-- 活動結束 -->
                            <div class="filter-field">
                                <label>活動結束（迄）</label>
                                <input type="hidden" id="event-end-to">
                                <div class="event-datetime-group">
                                    <input type="date" id="event-end-to-date">
                                    <select id="event-end-to-hour"></select>
                                    <select id="event-end-to-minute">
                                        <option value="00">整點</option>
                                        <option value="30">半點</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>
            </div>

            <!-- 結果區 -->
            <section class="portal-section portal-section--dynamic">
                <div class="portal-section-head">
                    <h2 class="portal-section-title">活動列表</h2>
                    <div style="font-size:0.78rem;color:var(--text-muted);display:flex;gap:0.75rem;align-items:center;">
                        <span id="result-count">搜尋中...</span>
                        <span id="results-page-info"></span>
                    </div>
                </div>

                <div id="events-container" class="feed-stream-list">
                    <div class="event-state">
                        <div class="loading">
                            <div class="spinner"></div>
                        </div>
                    </div>
                </div>

                <div class="feed-footer">
                    <div id="pagination-container"></div>
                </div>
            </section>

        </div>
    </div>

    <footer>
        <p>&copy; 2026 社團活動資訊統整平台 - 打造最好的校園社團生態</p>
    </footer>

    <script src="../js/main.js?v=20260603c"></script>
    <script src="../js/events.js?v=20260528"></script>
</body>

</html>
