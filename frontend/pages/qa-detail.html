<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>提問詳情 - 社團平台</title>
    <link rel="stylesheet" href="../css/styles.css">
    <style>
        .qd-wrap {
            margin: 1.25rem 0 3rem;
        }

        .qd-nav {
            margin-bottom: 1rem;
        }

        .qd-back-link {
            color: var(--text-muted);
            font-size: 0.85rem;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            transition: color 0.15s;
        }
        .qd-back-link:hover { color: var(--brand); }

        .qd-question {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.4rem 1.5rem;
            box-shadow: 0 1px 3px rgba(15, 23, 42, 0.05);
            margin-bottom: 1rem;
        }

        .qd-question-head {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 1rem;
            margin-bottom: 0.85rem;
        }

        .qd-question-head-main { flex: 1; min-width: 0; }

        .qd-title {
            margin: 0 0 0.5rem;
            font-size: 1.3rem;
            font-weight: 700;
            line-height: 1.35;
            color: var(--text-strong);
        }

        .qd-meta {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.45rem;
        }

        .qd-meta-date {
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        .qd-content {
            line-height: 1.65;
            color: var(--text-default);
            font-size: 0.95rem;
            white-space: pre-wrap;
            padding: 1rem 0;
            border-top: 1px solid var(--color-border-light);
            border-bottom: 1px solid var(--color-border-light);
            margin-bottom: 0.85rem;
        }

        .qd-stats {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.4rem;
            font-size: 0.82rem;
            color: var(--text-muted);
            margin-bottom: 0.85rem;
        }

        .qd-stat-sep { opacity: 0.45; }

        .qd-actions {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
            padding-top: 0.75rem;
            border-top: 1px solid var(--color-border-light);
        }

        .qd-thread {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.25rem 1.5rem;
            box-shadow: 0 1px 3px rgba(15, 23, 42, 0.05);
            margin-bottom: 1rem;
        }

        .qd-thread-hd {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid var(--color-border-light);
            margin-bottom: 1rem;
        }

        .qd-thread-title {
            margin: 0;
            font-size: 0.97rem;
            font-weight: 700;
            color: var(--text-strong);
        }

        .qd-compose {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.25rem 1.5rem;
            box-shadow: 0 1px 3px rgba(15, 23, 42, 0.05);
        }

        .qd-login-hint {
            color: var(--text-muted);
            font-size: 0.9rem;
        }
        .qd-login-hint p { margin: 0; }

        .qd-compose-hd {
            margin: 0 0 1rem;
            font-size: 0.97rem;
            font-weight: 700;
            color: var(--text-strong);
        }

        @media (max-width: 600px) {
            .qd-question-head { flex-direction: column; }
            .qd-question-head .badge { align-self: flex-start; }
            .qd-wrap { margin-top: 0.75rem; margin-bottom: 1.5rem; }
        }
    </style>
</head>

<body>
    <header>
        <nav>
            <a href="../index.html" class="logo">輔大社團活動資訊系統<span class="logo__sub">FJCU CLUB ACTIVITY INFORMATION SYSTEM</span></a>
            <ul class="nav-links">
                <li><a href="../index.html">首頁</a></li>
                <li><a href="club-list.html">社團</a></li>
                <li><a href="events.html">活動</a></li>
                <li><a href="qa.html">提問</a></li>
            </ul>
            <div class="nav-right">
                <button id="login-btn" class="btn btn-primary btn-sm" onclick="window.location.href = 'login.html'">登入</button>
                <button id="logout-btn" class="btn btn-secondary btn-sm" onclick="handleLogout()" style="display: none;">登出</button>
                <span id="user-dropdown" style="display: none;"></span>
            </div>
        </nav>
    </header>

    <div id="alert-container"></div>

    <div class="container">
        <div id="loading" class="loading" style="display: block;">
            <div class="spinner"></div>
            <p>載入提問詳情...</p>
        </div>

        <div id="qa-detail" style="display: none;">
            <div class="qd-wrap">

                <div class="qd-nav">
                    <a href="qa.html" class="qd-back-link">← 返回提問列表</a>
                </div>

                <!-- 問題主體 -->
                <div class="qd-question">
                    <div class="qd-question-head">
                        <div class="qd-question-head-main">
                            <h1 id="question-title" class="qd-title"></h1>
                            <div class="qd-meta">
                                <span id="question-author" class="badge"></span>
                                <span id="question-date" class="qd-meta-date"></span>
                                <span id="question-category" class="tag tag-primary"></span>
                            </div>
                        </div>
                        <div id="question-status" class="badge"></div>
                    </div>

                    <div id="question-content" class="qd-content"></div>

                    <div class="qd-stats">
                        <span class="qd-stat"><span id="replies-count">0</span> 則回覆</span>
                        <span class="qd-stat-sep">·</span>
                        <span class="qd-stat"><span id="views-count">0</span> 次瀏覽</span>
                        <span class="qd-stat-sep">·</span>
                        <span class="qd-stat">👍 <span id="helpful-count">0</span></span>
                        <span class="qd-stat-sep">·</span>
                        <span class="qd-stat">👎 <span id="not-helpful-count">0</span></span>
                    </div>

                    <div class="qd-actions">
                        <div id="question-actions" style="display: none;">
                            <button id="mark-solved-btn" class="btn btn-success btn-sm">標記為已解決</button>
                        </div>
                        <button id="report-question-btn" class="btn btn-secondary btn-sm">檢舉此提問</button>
                    </div>
                </div>

                <!-- 回覆串 -->
                <div class="qd-thread">
                    <div class="qd-thread-hd">
                        <h3 class="qd-thread-title">回覆列表</h3>
                    </div>
                    <div id="replies-list">
                        <p>載入中...</p>
                    </div>
                </div>

                <!-- 回覆表單 -->
                <div class="qd-compose">
                    <div id="reply-form-section" class="qd-login-hint">
                        <p>請先登入以提供回覆</p>
                    </div>
                    <div id="reply-form" style="display: none;">
                        <h4 class="qd-compose-hd">提供回覆</h4>
                        <form id="add-reply-form">
                            <input type="hidden" id="reply-parent-id" value="">
                            <div class="form-group">
                                <label for="reply-content">回覆內容</label>
                                <textarea id="reply-content" rows="5" placeholder="提供您的解答或建議..." required></textarea>
                            </div>
                            <div class="form-group">
                                <label>
                                    <input type="checkbox" id="is-official-reply"> 官方回覆（該社團幹部）
                                </label>
                            </div>
                            <button type="submit" class="btn btn-primary">提交回覆</button>
                        </form>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <div id="report-modal" style="display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.45); z-index: 1200; align-items: center; justify-content: center; padding: 1rem;">
        <div style="background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 12px 32px rgba(15,23,42,0.18); padding: 1.5rem; max-width: 560px; width: 100%;">
            <h3 style="margin: 0 0 1.25rem; font-size: 1.1rem; color: var(--text-strong);">送出檢舉</h3>
            <form id="report-form">
                <div class="form-group">
                    <label for="report-type-select">檢舉事由</label>
                    <select id="report-type-select" required>
                        <option value="">請選擇檢舉事由</option>
                        <option value="harassment">人身攻擊 / 騷擾</option>
                        <option value="misinformation">不實資訊</option>
                        <option value="spam">垃圾訊息 / 廣告</option>
                        <option value="inappropriate">不當內容</option>
                        <option value="other">其他</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="report-reason-input">補充說明</label>
                    <textarea id="report-reason-input" rows="4" placeholder="請輸入檢舉說明"></textarea>
                </div>
                <div style="display: flex; gap: 0.75rem; justify-content: flex-end;">
                    <button type="button" id="report-cancel-btn" class="btn btn-secondary">取消</button>
                    <button type="submit" class="btn btn-primary">送出檢舉</button>
                </div>
            </form>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 社團活動資訊統整平台 - 打造最好的校園社團生態</p>
    </footer>

    <script src="../js/main.js?v=20260510"></script>
    <script src="../js/qa-detail.js?v=20260528"></script>
</body>

</html>
