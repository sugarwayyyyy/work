<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>我的社團 — 幹部後台</title>
    <link rel="stylesheet" href="../css/styles.css?v=20260502k" />
    <link rel="stylesheet" href="../css/admin.css?v=20260502k" />
    <link rel="stylesheet" href="../css/club-admin-dashboard.css?v=20260502k" />
</head>
<body class="admin-dashboard-page club-admin-page">
    <header>
        <nav>
            <a href="admin-users.html" class="logo">輔大社團活動資訊系統<span class="logo__sub">FJCU CLUB ACTIVITY INFORMATION SYSTEM</span></a>
            <ul class="nav-links"></ul>
            <div class="nav-right">
                <button id="login-btn" class="btn btn-primary btn-sm" onclick="window.location.href='login.html'" style="display:none;">登入</button>
                <button id="logout-btn" class="btn btn-secondary btn-sm" onclick="handleLogout()" style="display: none;">登出</button>
                <span id="user-dropdown" style="display: none;"></span>
            </div>
        </nav>
    </header>

    <div id="alert-container"></div>

    <div class="container admin-dashboard-container">

        <div class="admin-stats-bar reveal-up">
            <div class="stat-item"><strong id="stat-my-clubs">-</strong><span>所屬社團</span></div>
            <div class="stat-item"><strong id="stat-current-club" class="stat-club-name">—</strong><span>目前管理</span></div>
            <div class="stat-item stat-club-only"><strong id="stat-followers">-</strong><span>追蹤數</span></div>
            <div class="stat-item stat-club-only"><strong id="stat-total-events">-</strong><span>活動總數</span></div>
            <div class="stat-item stat-club-only"><strong id="stat-upcoming">-</strong><span>即將舉行</span></div>
            <div class="stat-item stat-club-only"><strong id="stat-published">-</strong><span>已發布</span></div>
            <div class="stat-item stat-club-only"><strong id="stat-cancelled">-</strong><span>已取消</span></div>
            <div class="stat-item stat-club-only"><strong id="stat-registrations">-</strong><span>總報名</span></div>
            <div class="stat-item stat-club-only"><strong id="stat-avg-rating">-</strong><span>平均評分</span></div>
            <div class="stat-item stat-club-only"><strong id="stat-unanswered-qa">-</strong><span>未回答 Q&amp;A</span></div>
        </div>

        <section class="card admin-panel reveal-up">
            <div class="admin-panel-head">
                <h2>我的社團</h2>
                <span class="admin-panel-subtext">選擇社團以開始管理</span>
            </div>
            <div id="my-clubs-container" class="club-admin-clubs"></div>
            <p class="admin-club-select-hint">點選「管理社團」後，將跳至社團管理頁面。</p>
        </section>

        <div id="club-action-selector" style="display:none;" aria-hidden="true">
            <span id="club-action-subtitle"></span>
        </div>

    </div>

    <script src="../js/main.js?v=20260502k"></script>
    <script src="../js/club-admin-dashboard.js"></script>
    <script>
        window.handleClubSelect = function (clubId, clubName) {
            sessionStorage.setItem('clubAdmin_clubId', clubId);
            sessionStorage.setItem('clubAdmin_clubName', clubName);
            window.location.href = 'club-admin-club-manage.html';
        };

        (function () {
            const container = document.getElementById('my-clubs-container');
            const statEl = document.getElementById('stat-my-clubs');
            if (!container || !statEl) return;
            const obs = new MutationObserver(() => {
                const count = container.querySelectorAll('.admin-item-card').length;
                statEl.textContent = count || '-';
            });
            obs.observe(container, { childList: true });
        })();

        (function () {
            const clubId = Number(sessionStorage.getItem('clubAdmin_clubId') || 0);
            const clubName = sessionStorage.getItem('clubAdmin_clubName') || '';
            const nameEl = document.getElementById('stat-current-club');
            if (nameEl && clubName) nameEl.textContent = clubName;
            if (clubId) loadClubAdminStats(clubId);
        })();
    </script>
</body>
</html>
