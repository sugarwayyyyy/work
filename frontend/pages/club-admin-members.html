    <link rel="stylesheet" href="../css/club-admin-dashboard.css?v=20260502k" />
</head>
<body class="admin-dashboard-page club-admin-page">
    <header>
        <nav>
            <a href="club-admin-club-manage.html" class="logo">輔大社團活動資訊系統<span class="logo__sub">FJCU CLUB ACTIVITY INFORMATION SYSTEM</span></a>
            <ul class="nav-links">
                <li><a href="../index.html">返回首頁</a></li>
                <li><a href="club-admin-club-manage.html">社團管理</a></li>
                <li><a href="club-admin-events-list.html">活動列表</a></li>
                <li><a href="club-admin-members.html" class="active">成員管理</a></li>
                <li><a href="club-admin-applications.html" id="nav-link-applications">待審核申請<span id="nav-app-badge" class="nav-link-badge"></span></a></li>
                <li><a href="club-admin-transfer.html">帳戶轉讓</a></li>
            </ul>
            <div class="nav-right">
                <button id="login-btn" class="btn btn-primary btn-sm" onclick="window.location.href='login.html'" style="display:none;">登入</button>
                <button id="logout-btn" class="btn btn-secondary btn-sm" onclick="handleLogout()" style="display: none;">登出</button>
                <span id="user-dropdown" style="display: none;"></span>
            </div>
        </nav>
    </header>

    <div id="alert-container"></div>

    <div class="container admin-dashboard-container">

        <div class="admin-stats-bar-wrap">
        <div class="admin-stats-bar reveal-up">
            <div class="stat-item"><strong id="stat-my-clubs">-</strong><span>所屬社團</span></div>
            <div class="stat-item"><strong id="stat-current-club" class="stat-club-name">—</strong><span>目前管理</span></div>
            <div class="stat-item stat-club-only"><strong id="stat-followers">-</strong><span>追蹤數</span></div>
            <div class="stat-item stat-club-only"><strong id="stat-total-events">-</strong><span>活動總數</span></div>
            <div class="stat-item stat-club-only"><strong id="stat-upcoming">-</strong><span>即將舉行</span></div>
            <div class="stat-item stat-club-only"><strong id="stat-published">-</strong><span>已發布</span></div>
            <div class="stat-item stat-club-only"><strong id="stat-cancelled">-</strong><span>已取消</span></div>
            <div class="stat-item stat-club-only"><strong id="stat-registrations">-</strong><span>總報名</span></div>
            <div class="stat-item stat-club-only"><strong id="stat-avg-rating">-</strong><span>平均評分</span></div>
            <div class="stat-item stat-club-only"><strong id="stat-unanswered-qa">-</strong><span>未回答 Q&amp;A</span></div>
        </div>
        </div>

        <div id="selected-club-banner" class="admin-selected-club-banner" style="display:none;">
            <span>目前管理：<strong id="selected-club-name">-</strong></span>
            <button type="button" class="btn btn-secondary btn-sm" onclick="openClubSwitchPopup()">切換社團</button>
        </div>

        <section class="portal-section portal-section--dynamic reveal-up" id="members-section">
            <div class="portal-section-head">
                <div>
                    <h2 class="portal-section-title">成員管理</h2>
                    <p class="portal-section-desc" id="members-subtitle">檢視社團成員；社長可指派或變更幹部職稱。</p>
                </div>
            </div>
            <div class="club-events-toolbar">
                <div class="filter-field">
                    <label for="member-search">搜尋成員</label>
                    <input type="text" id="member-search" placeholder="姓名或學號…">
                </div>
                <div class="filter-field">
                    <label for="member-role-filter">職稱篩選</label>
                    <select id="member-role-filter">
                        <option value="">全部</option>
                        <option value="社長">社長</option>
                        <option value="副社長">副社長</option>
                        <option value="公關">公關</option>
                        <option value="財務">財務</option>
                        <option value="幹部">幹部</option>
                        <option value="一般社員">一般社員</option>
                        <option value="指導老師">指導老師</option>
                    </select>
                </div>
            </div>
            <div id="members-list-wrap">
                <p class="widget-empty">載入中…</p>
            </div>
        </section>

    </div>

    <script src="../js/main.js?v=20260510"></script>
    <script src="../js/club-admin-dashboard.js?v=20260530"></script>
    <script>
        // ── 成員列表前端篩選 ──────────────────────────────────────────
        function filterMembers() {
            const search     = (document.getElementById('member-search')?.value || '').trim().toLowerCase();
            const roleFilter = document.getElementById('member-role-filter')?.value || '';

            const rows = document.querySelectorAll('#members-list-wrap tbody tr');
            let visible = 0;
            rows.forEach(tr => {
                const cells  = tr.querySelectorAll('td');
                const name   = (cells[0]?.textContent || '').toLowerCase();
                const stuId  = (cells[1]?.textContent || '').toLowerCase();
                const role   = (cells[2]?.textContent || '').trim();

                const matchSearch = !search     || name.includes(search) || stuId.includes(search);
                const matchRole   = !roleFilter || role.startsWith(roleFilter);

                tr.style.display = (matchSearch && matchRole) ? '' : 'none';
                if (matchSearch && matchRole) visible++;
            });

            // 無結果提示
            const table = document.querySelector('#members-list-wrap table');
            const existing = document.getElementById('member-filter-empty');
            if (table && visible === 0 && rows.length > 0) {
                if (!existing) {
                    const msg = document.createElement('p');
                    msg.id = 'member-filter-empty';
                    msg.className = 'widget-empty';
                    msg.textContent = '沒有符合條件的成員';
                    table.after(msg);
                }
            } else if (existing) {
                existing.remove();
            }
        }

        document.getElementById('member-search')?.addEventListener('input', filterMembers);
        document.getElementById('member-role-filter')?.addEventListener('change', filterMembers);

        // ── 頁面初始化 ────────────────────────────────────────────────
        (async function () {
            if (window._pageInitReady) {
                await Promise.race([window._pageInitReady, new Promise(r => setTimeout(r, 3000))]);
            }
            let clubId   = Number(sessionStorage.getItem('clubAdmin_clubId') || 0);
            let clubName = sessionStorage.getItem('clubAdmin_clubName') || '';
            if (!clubId) {
                try {
                    const res = await APIClient.get('club-admin.php?action=my_clubs');
                    const firstClub = (res && res.success && res.data && Array.isArray(res.data.clubs))
                        ? res.data.clubs[0] : null;
                    if (firstClub) {
                        clubId   = Number(firstClub.club_id) || 0;
                        clubName = String(firstClub.club_name || '');
                        sessionStorage.setItem('clubAdmin_clubId', String(clubId));
                        sessionStorage.setItem('clubAdmin_clubName', clubName);
                    }
                } catch (err) {
                    console.error('Failed to resolve default club', err);
                }
            }
            if (!clubId) {
                openClubSwitchPopup();
                return;
            }
            currentClubId   = clubId;
            currentClubName = clubName;
            const nameEl = document.getElementById('stat-current-club');
            if (nameEl) nameEl.textContent = clubName || '—';
            const banner     = document.getElementById('selected-club-banner');
            const bannerName = document.getElementById('selected-club-name');
            if (bannerName) bannerName.textContent = clubName || '-';
            if (banner) banner.style.display = '';
            const subtitle = document.getElementById('members-subtitle');
            if (subtitle && clubName) subtitle.textContent = clubName + ' 的社團成員';

            loadClubAdminStats(clubId);
            loadClubMembers(clubId);
            updateNavApplicationsBadge(clubId);
        })();
    </script>
</body>
</html>
