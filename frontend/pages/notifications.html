<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>通知中心 - 社團平台</title>
    <link rel="stylesheet" href="../css/styles.css?v=20260601">
    <link rel="stylesheet" href="../css/admin.css?v=20260603">
    <link rel="stylesheet" href="../css/home.css?v=20260502k">
</head>

<body>
    <header>
        <nav>
            <a href="../index.html" class="logo">輔大社團活動資訊系統<span class="logo__sub">FJCU CLUB ACTIVITY INFORMATION SYSTEM</span></a>
            <ul class="nav-links">
                <li><a href="../index.html">首頁</a></li>
                <li><a href="club-list.html">社團</a></li>
                <li><a href="events.html">活動</a></li>
                <li><a href="qa.html">提問</a></li>
            </ul>
            <div class="nav-right">
                <button id="login-btn" class="btn btn-primary btn-sm" onclick="window.location.href='login.html'" style="display:none;">登入</button>
                <button id="logout-btn" class="btn btn-secondary btn-sm" onclick="handleLogout()" style="display: none;">登出</button>
                <span id="user-dropdown" style="display: none;"></span>
            </div>
        </nav>
    </header>

    <div id="alert-container"></div>

    <div class="home-shell">
        <div class="container home-container">
            <section class="portal-section portal-section--dynamic">
                <div class="portal-section-head">
                    <h2 class="portal-section-title">通知中心</h2>
                    <div style="display:flex;align-items:center;gap:0.6rem;">
                        <span id="notif-unread-count" style="font-size:0.78rem;color:var(--text-muted);"></span>
                        <button id="mark-all-read-btn" class="btn btn-secondary btn-sm" onclick="markAllAsRead()" style="display:none;">全部標為已讀</button>
                    </div>
                </div>
                <div id="notifications-list" class="feed-stream-list">
                    <div class="feed-item-card" style="display:flex;justify-content:center;padding:2rem 0;">
                        <div class="loading">
                            <div class="spinner"></div>
                            <p>載入通知中...</p>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 社團活動資訊統整平台 - 打造最好的校園社團生態</p>
    </footer>

    <style>
        .notif-card-wrap {
            position: relative;
        }
        .notif-delete-btn {
            position: absolute;
            top: 50%;
            right: 10px;
            transform: translateY(-50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 26px;
            height: 26px;
            border: none;
            background: transparent;
            border-radius: 6px;
            cursor: pointer;
            color: var(--text-muted, #9ca3af);
            font-size: 1rem;
            opacity: 0;
            transition: opacity 0.15s, background 0.15s, color 0.15s;
            z-index: 1;
        }
        .notif-card-wrap:hover .notif-delete-btn {
            opacity: 1;
        }
        .notif-delete-btn:hover {
            background: #fee2e2;
            color: #dc2626;
        }
        .feed-item-link { padding-right: 36px; }
    </style>

    <script src="../js/main.js?v=20260603c"></script>
    <script src="../js/notifications.js?v=20260603e"></script>
</body>

</html>
