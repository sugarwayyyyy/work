<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>通知中心 - 社團平台</title>
    <link rel="stylesheet" href="../css/styles.css?v=20260502k">
    <link rel="stylesheet" href="../css/home.css?v=20260502k">
</head>

<body>
    <header>
        <nav>
            <a href="admin-users.html" class="logo">輔大社團活動資訊系統<span class="logo__sub">FJCU CLUB ACTIVITY INFORMATION SYSTEM</span></a>
            <ul class="nav-links">
                <li><a href="../index.html">首頁</a></li>
                <li><a href="club-list.html">社團</a></li>
                <li><a href="events.html">活動</a></li>
                <li><a href="qa.html">提問</a></li>
            </ul>
            <div class="nav-right">
                <button id="login-btn" class="btn btn-primary btn-sm" onclick="window.location.href='login.html'" style="display:none;">登入</button>
                <button id="logout-btn" class="btn btn-secondary btn-sm" onclick="handleLogout()" style="display: none;">登出</button>
                <span id="user-dropdown" style="display: none;"></span>
            </div>
        </nav>
    </header>

    <div id="alert-container"></div>

    <div class="home-shell">
        <div class="container home-container">
            <section class="portal-section portal-section--dynamic">
                <div class="portal-section-head">
                    <h2 class="portal-section-title">通知中心</h2>
                    <div style="display:flex;align-items:center;gap:0.6rem;">
                        <span id="notif-unread-count" style="font-size:0.78rem;color:var(--text-muted);"></span>
                        <button id="mark-all-read-btn" class="btn btn-secondary btn-sm" onclick="markAllAsRead()" style="display:none;">全部已讀</button>
                    </div>
                </div>
                <div id="notifications-list" class="feed-stream-list">
                    <div class="feed-item-card" style="display:flex;justify-content:center;padding:2rem 0;">
                        <div class="loading">
                            <div class="spinner"></div>
                            <p>載入通知中...</p>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 社團活動資訊統整平台 - 打造最好的校園社團生態</p>
    </footer>

    <script src="../js/main.js?v=20260510"></script>
    <script>
        async function loadNotifications() {
            try {
                const response = await APIClient.get('notifications.php');
                if (response.success) {
                    displayNotifications(response.data.notifications);
                } else {
                    PageUtils.showAlert(response.message, 'error');
                }
            } catch (error) {
                console.error('Error:', error);
                PageUtils.showAlert('載入通知失敗', 'error');
            }
        }

        function displayNotifications(notifications) {
            const container = document.getElementById('notifications-list');
            const unreadCountEl = document.getElementById('notif-unread-count');

            if (notifications.length === 0) {
                container.innerHTML = '<div class="feed-item-card" style="text-align:center;padding:2.5rem 0;color:var(--text-muted);">目前沒有新通知</div>';
                if (unreadCountEl) unreadCountEl.textContent = '';
                const markAllBtn = document.getElementById('mark-all-read-btn');
                if (markAllBtn) markAllBtn.style.display = 'none';
                return;
            }

            const unreadCount = notifications.filter(n => !n.is_read).length;
            if (unreadCountEl) unreadCountEl.textContent = unreadCount > 0 ? `${unreadCount} 則未讀` : '全部已讀';
            const markAllBtn = document.getElementById('mark-all-read-btn');
            if (markAllBtn) markAllBtn.style.display = unreadCount > 0 ? '' : 'none';

            let html = '';
            notifications.forEach(notification => {
                const notificationId = Number(notification.notification_id) || 0;
                const title = PageUtils.escapeHtml(notification.title || '通知');
                const message = PageUtils.escapeHtml(notification.message || '');
                const timeAgo = PageUtils.timeAgo(notification.created_at);
                const targetUrl = getNotificationTargetUrl(notification);
                const safeTargetUrl = PageUtils.escapeAttribute(targetUrl || '');
                const isUnread = !notification.is_read;
                const alreadyRead = notification.is_read ? 'true' : 'false';
                const isClickable = !!(targetUrl || isUnread);

                const clickAttr = targetUrl
                    ? ` onclick="handleNotificationClick(${notificationId}, '${safeTargetUrl}', ${alreadyRead})"`
                    : (isUnread ? ` onclick="handleNotificationClick(${notificationId}, '', false)"` : '');

                if (isClickable) {
                    html += `
                    <div class="feed-item-card">
                        <button class="feed-item-link feed-item-link--announcement"${clickAttr}>
                            <div class="feed-item-head">
                                <h3 class="feed-item-title"${isUnread ? '' : ' style="color:var(--text-muted);font-weight:400;"'}>${title}</h3>
                                ${isUnread ? '<span class="feed-item-badge">新</span>' : ''}
                            </div>
                            ${message ? `<p class="feed-item-body">${message}</p>` : ''}
                            <time class="feed-item-time">${timeAgo}</time>
                        </button>
                    </div>`;
                } else {
                    html += `
                    <div class="feed-item-card">
                        <div class="feed-item-link" style="cursor:default;">
                            <div class="feed-item-head">
                                <h3 class="feed-item-title" style="color:var(--text-muted);font-weight:400;">${title}</h3>
                            </div>
                            ${message ? `<p class="feed-item-body">${message}</p>` : ''}
                            <time class="feed-item-time">${timeAgo}</time>
                        </div>
                    </div>`;
                }
            });
            container.innerHTML = html;
        }

        function getNotificationTargetUrl(notification) {
            const notificationType = String(notification.notification_type || '').toLowerCase();
            const relatedType = String(notification.related_type || '').toLowerCase();
            const relatedId = Number(notification.related_id) || 0;
            if (!relatedId) return '';

            if (relatedType === 'event') return `event-detail.html?id=${relatedId}`;
            if (notificationType === 'qa_reply') {
                const qaId = Number(notification.qa_id_from_reply) || 0;
                if (qaId > 0) return `qa-detail.html?id=${qaId}#reply-${relatedId}`;
            }
            if (relatedType === 'qa') return `qa-detail.html?id=${relatedId}`;
            return '';
        }

        async function markAsRead(notificationId) {
            try {
                const response = await APIClient.post('notifications.php?action=mark_read', {
                    notification_id: notificationId
                });
                if (response.success) loadNotifications();
            } catch (error) {
                console.error('Error:', error);
            }
        }

        async function handleNotificationClick(notificationId, targetUrl, alreadyRead) {
            if (!alreadyRead && notificationId > 0) {
                await markAsRead(notificationId);
            }
            if (targetUrl) {
                window.location.href = targetUrl;
            } else if (!alreadyRead) {
                loadNotifications();
            }
        }

        async function markAllAsRead() {
            const btn = document.getElementById('mark-all-read-btn');
            if (btn) { btn.disabled = true; btn.textContent = '處理中…'; }
            try {
                const response = await APIClient.post('notifications.php?action=mark_all_read', {});
                if (response.success) {
                    loadNotifications();
                } else {
                    PageUtils.showAlert(response.message || '操作失敗', 'error');
                    if (btn) { btn.disabled = false; btn.textContent = '全部已讀'; }
                }
            } catch (error) {
                console.error('Error:', error);
                PageUtils.showAlert('操作失敗', 'error');
                if (btn) { btn.disabled = false; btn.textContent = '全部已讀'; }
            }
        }

        window.addEventListener('DOMContentLoaded', function () {
            loadNotifications();
        });
    </script>
</body>

</html>
