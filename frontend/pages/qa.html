<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>提問 - 社團平台</title>
    <link rel="stylesheet" href="../css/styles.css?v=20260530">
    <link rel="stylesheet" href="../css/home.css">
    <link rel="stylesheet" href="../css/events.css">
    <style>
        #ask-modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .ask-modal-card {
            background: #fff;
            border-radius: 1rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.18);
            width: min(520px, 100%);
            max-height: calc(100vh - 2rem);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1.25rem 1.5rem 1rem;
            flex-shrink: 0;
            border-bottom: 1px solid #e5e7eb;
        }

        .modal-title {
            margin: 0;
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-default, #111827);
        }

        .modal-close-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: #9ca3af;
            font-size: 1.1rem;
            width: 2rem;
            height: 2rem;
            border-radius: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: color 0.15s ease, background-color 0.15s ease;
        }

        .modal-close-btn:hover {
            color: #374151;
            background-color: #f3f4f6;
        }

        .modal-body {
            padding: 1.25rem 1.5rem 1.5rem;
            overflow-y: auto;
            flex: 1;
        }

        .modal-body .form-group {
            margin-bottom: 1rem;
        }

        .modal-body textarea {
            min-height: 96px;
        }

        /* ── Dark mode: ask modal ── */
        [data-theme="dark"] .ask-modal-card {
            background: #212121;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
        }
        [data-theme="dark"] .modal-header { border-bottom-color: #2A2A2A; }
        [data-theme="dark"] .modal-close-btn { color: #888888; }
        [data-theme="dark"] .modal-close-btn:hover { color: #F5F5F5; background-color: #303030; }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) .ask-modal-card {
                background: #212121;
                box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            }
            :root:not([data-theme="light"]) .modal-header { border-bottom-color: #2A2A2A; }
            :root:not([data-theme="light"]) .modal-close-btn { color: #888888; }
            :root:not([data-theme="light"]) .modal-close-btn:hover { color: #F5F5F5; background-color: #303030; }
        }
    </style>
</head>

<body>
    <header>
        <nav>
            <a href="../index.html" class="logo">輔大社團活動資訊系統<span class="logo__sub">FJCU CLUB ACTIVITY INFORMATION SYSTEM</span></a>
            <ul class="nav-links">
                <li><a href="../index.html">首頁</a></li>
                <li><a href="club-list.html">社團</a></li>
                <li><a href="events.html">活動</a></li>
                <li><a href="qa.html">提問</a></li>
            </ul>
            <div class="nav-right">
                <button id="login-btn" class="btn btn-primary btn-sm" onclick="window.location.href = 'login.html'">登入</button>
                <button id="logout-btn" class="btn btn-secondary btn-sm" onclick="handleLogout()" style="display: none;">登出</button>
                <span id="user-dropdown" style="display: none;"></span>
            </div>
        </nav>
    </header>

    <div id="alert-container"></div>

    <div class="container">
        <div class="event-filter-card filter-card">
            <div class="filter-card__body">
                <div class="event-filter-topbar">
                    <div class="filter-field event-filter-keyword">
                        <input type="text" id="qa-search" placeholder="搜尋標題、內容、社團名稱或類別…">
                    </div>
                    <button id="qa-search-btn" class="btn btn-primary btn-sm" type="button">搜尋</button>
                    <button id="qa-reset-btn" class="btn btn-secondary btn-sm" type="button">重製</button>
                    <button
                        id="qa-advanced-toggle-btn"
                        class="event-filter-toggle-btn"
                        type="button"
                        aria-expanded="false"
                        aria-controls="qa-advanced-filters"
                    >
                        進階篩選 <span class="toggle-arrow">&#9660;</span>
                    </button>
                </div>

                <div class="event-filter-toolbar">
                    <div class="event-filter-toolbar__status">
                        <span class="event-filter-toolbar__label">提問狀態</span>
                        <div id="qa-status-filters" class="chip-cloud"></div>
                    </div>
                </div>

                <div id="qa-advanced-filters" class="event-advanced-filters" aria-hidden="true">
                    <div class="event-filter-grid event-filter-grid--advanced event-filter-grid--3col">
                        <div class="filter-field">
                            <label for="qa-category-filter">社團類別</label>
                            <select id="qa-category-filter">
                                <option value="">全部類別</option>
                            </select>
                        </div>
                        <div class="filter-field">
                            <label for="qa-club-filter">社團篩選</label>
                            <select id="qa-club-filter" disabled>
                                <option value="">請先選擇類別</option>
                            </select>
                        </div>
                        <div class="filter-field">
                            <label for="qa-status-filter">提問狀態</label>
                            <select id="qa-status-filter">
                                <option value="">全部</option>
                                <option value="open">開放中</option>
                                <option value="closed">已關閉</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <section class="portal-section portal-section--dynamic">
            <div class="portal-section-head">
                <h2 class="portal-section-title">提問列表</h2>
                <button id="ask-btn" class="btn btn-primary btn-sm" onclick="openAskModal()">發布新提問</button>
            </div>

            <div id="qa-container" class="feed-stream-list">
                <div class="loading">
                    <div class="spinner"></div>
                    <p>載入中...</p>
                </div>
            </div>
        </section>
    </div>

    <div id="ask-modal" style="display: none;">
        <div class="ask-modal-card">
            <div class="modal-header">
                <h2 class="modal-title">發布提問</h2>
                <button type="button" class="modal-close-btn" onclick="closeAskModal()" aria-label="關閉">✕</button>
            </div>
            <div class="modal-body">
                <form id="ask-form">
                    <div class="form-group">
                        <label for="ask-category">選擇社團類別</label>
                        <select id="ask-category" required>
                            <option value="">-- 請先選擇類別 --</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="ask-club">選擇社團</label>
                        <select id="ask-club" required disabled>
                            <option value="">-- 請先選擇類別 --</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="ask-title">提問標題</label>
                        <input type="text" id="ask-title" required>
                    </div>

                    <div class="form-group">
                        <label for="ask-content">提問內容</label>
                        <textarea id="ask-content" required></textarea>
                    </div>

                    <div class="form-group">
                        <label>抓字推薦標籤</label>
                        <div id="ask-tag-hint" style="color: var(--text-light); font-size: 0.9rem; margin-bottom: 0.5rem;">輸入標題或內容後，系統會自動抓字推薦標籤。</div>
                        <div id="ask-tags" style="display: flex; flex-wrap: wrap; gap: 0.5rem;"></div>
                    </div>

                    <div class="form-group">
                        <label>緊急程度</label>
                        <input type="hidden" id="ask-urgency" value="normal">
                        <div style="display: flex; gap: 0.75rem; flex-wrap: wrap;">
                            <button type="button" class="btn btn-secondary btn-sm urgency-btn is-active" data-urgency="normal">一般</button>
                            <button type="button" class="btn btn-secondary btn-sm urgency-btn" data-urgency="important">重要</button>
                            <button type="button" class="btn btn-secondary btn-sm urgency-btn" data-urgency="urgent">緊急</button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>
                            <input type="checkbox" id="ask-anonymous">
                            匿名提問
                        </label>
                    </div>

                    <div style="display: flex; gap: 1rem;">
                        <button type="submit" class="btn btn-primary">發布</button>
                        <button type="button" class="btn btn-secondary" onclick="closeAskModal()">取消</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 社團活動資訊統整平台 - 打造最好的校園社團生態</p>
    </footer>

    <script src="../js/main.js?v=20260603c"></script>
    <script src="../js/qa.js?v=20260530"></script>
</body>

</html>
