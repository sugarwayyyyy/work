<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>提問 - 社團平台</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/home.css">
    <style>
        #ask-modal {
            padding: 1rem;
        }

        #ask-modal .card {
            width: min(520px, 92vw);
            max-height: 82vh;
            overflow-y: auto;
            padding: 1.1rem 1.2rem;
            margin-bottom: 0;
        }

        #ask-modal h2 {
            margin-bottom: 0.9rem;
            font-size: 1.25rem;
        }

        #ask-modal .form-group {
            margin-bottom: 1rem;
        }

        #ask-modal textarea {
            min-height: 96px;
        }

        .qa-filter-card {
            margin-bottom: 1rem;
            padding: 0;
            overflow: hidden;
        }

        .qa-filter-card .filter-card__body {
            padding: 0.88rem;
        }

        .qa-filter-topbar {
            display: flex;
            align-items: flex-end;
            gap: 0.6rem;
            flex-wrap: wrap;
        }

        .qa-filter-keyword {
            flex: 1;
            min-width: 220px;
        }

        .qa-filter-keyword input {
            width: 100%;
        }

        .qa-filter-toggle-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            padding: 0.52rem 0.88rem;
            border: 1px solid var(--border);
            border-radius: 0.7rem;
            background: var(--surface);
            color: var(--text-default);
            font-size: 0.84rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
        }

        .qa-filter-toggle-btn:hover {
            border-color: var(--brand);
            color: var(--brand);
        }

        .qa-filter-toggle-btn.is-active {
            border-color: var(--brand);
            background: var(--brand-soft);
            color: var(--brand-hover);
        }

        .qa-filter-toggle-btn .toggle-arrow {
            display: inline-block;
            font-size: 0.7rem;
            transition: transform 0.22s ease;
        }

        .qa-filter-toggle-btn.is-active .toggle-arrow {
            transform: rotate(180deg);
        }

        .qa-advanced-filters {
            max-height: 0;
            overflow: hidden;
            margin-top: 0;
            transition: max-height 0.28s cubic-bezier(0.4, 0, 0.2, 1), margin-top 0.28s ease;
        }

        .qa-advanced-filters.is-open {
            max-height: 420px;
            margin-top: 0.74rem;
        }

        .qa-filter-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.65rem;
        }

        .qa-filter-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.6rem;
            padding-top: 0.72rem;
        }

        .qa-filter-toolbar__status {
            display: flex;
            align-items: center;
            gap: 0.45rem;
            flex-wrap: wrap;
        }

        .qa-filter-toolbar__label {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-muted);
            white-space: nowrap;
        }

        .qa-filter-actions {
            display: flex;
            gap: 0.5rem;
            padding-top: 0.74rem;
            margin-top: 0.74rem;
            border-top: 1px solid var(--color-border-light);
        }

        @media (max-width: 720px) {
            .qa-filter-topbar {
                flex-direction: column;
                align-items: stretch;
            }

            .qa-filter-keyword {
                min-width: 0;
            }

            .qa-filter-toggle-btn {
                justify-content: center;
            }

            .qa-filter-grid {
                grid-template-columns: 1fr;
            }

            .qa-filter-actions {
                flex-direction: column;
            }

            .qa-filter-toolbar {
                align-items: stretch;
            }
        }
    </style>
</head>

<body>
    <header>
        <nav>
            <a href="../index.html" class="logo">輔大社團活動資訊系統<span class="logo__sub">FJCU CLUB ACTIVITY INFORMATION SYSTEM</span></a>
            <ul class="nav-links">
                <li><a href="../index.html">首頁</a></li>
                <li><a href="club-list.html">社團</a></li>
                <li><a href="events.html">活動</a></li>
                <li><a href="qa.html">提問</a></li>
            </ul>
            <div class="nav-right">
                <button id="login-btn" class="btn btn-primary btn-sm" onclick="window.location.href = 'login.html'">登入</button>
                <button id="logout-btn" class="btn btn-secondary btn-sm" onclick="handleLogout()" style="display: none;">登出</button>
                <span id="user-dropdown" style="display: none;"></span>
            </div>
        </nav>
    </header>

    <div id="alert-container"></div>

    <div class="container">
        <h1>提問留言板</h1>

        <div class="card qa-filter-card">
            <div class="filter-card__body">
                <div class="qa-filter-topbar">
                    <div class="filter-field qa-filter-keyword">
                        <label for="qa-search">提問關鍵字</label>
                        <input type="text" id="qa-search" placeholder="搜尋標題、內容、社團名稱或類別...">
                    </div>
                    <button id="qa-search-btn" class="btn btn-primary btn-sm" type="button">搜尋</button>
                    <button id="qa-reset-btn" class="btn btn-secondary btn-sm" type="button">重製</button>
                    <button
                        id="qa-advanced-toggle-btn"
                        class="qa-filter-toggle-btn"
                        type="button"
                        aria-expanded="false"
                        aria-controls="qa-advanced-filters"
                    >
                        進階篩選 <span class="toggle-arrow">&#9660;</span>
                    </button>
                </div>

                <div class="qa-filter-toolbar">
                    <div class="qa-filter-toolbar__status">
                        <span class="qa-filter-toolbar__label">提問狀態</span>
                        <div id="qa-status-filters" class="chip-cloud"></div>
                    </div>
                </div>

                <div id="qa-advanced-filters" class="qa-advanced-filters" aria-hidden="true">
                    <div class="qa-filter-grid">
                        <div class="filter-field">
                            <label for="qa-club-filter">社團篩選</label>
                            <select id="qa-club-filter">
                                <option value="">全部社團</option>
                            </select>
                        </div>
                        <div class="filter-field">
                            <label for="qa-status-filter">提問狀態</label>
                            <select id="qa-status-filter">
                                <option value="">全部</option>
                                <option value="open">開放中</option>
                                <option value="closed">已關閉</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <section class="portal-section portal-section--dynamic">
            <div class="portal-section-head">
                <h2 class="portal-section-title">提問列表</h2>
                <button id="ask-btn" class="btn btn-primary btn-sm" onclick="openAskModal()">發布新提問</button>
            </div>

            <div id="qa-container" class="feed-stream-list">
                <div class="loading">
                    <div class="spinner"></div>
                    <p>載入中...</p>
                </div>
            </div>
        </section>
    </div>

    <div id="ask-modal" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center;">
        <div class="card">
            <h2>發布提問</h2>
            <form id="ask-form">
                <div class="form-group">
                    <label for="ask-category">選擇社團類別</label>
                    <select id="ask-category" required>
                        <option value="">-- 請先選擇類別 --</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="ask-club">選擇社團</label>
                    <select id="ask-club" required disabled>
                        <option value="">-- 請先選擇類別 --</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="ask-title">提問標題</label>
                    <input type="text" id="ask-title" required>
                </div>

                <div class="form-group">
                    <label for="ask-content">提問內容</label>
                    <textarea id="ask-content" required></textarea>
                </div>

                <div class="form-group">
                    <label>抓字推薦標籤</label>
                    <div id="ask-tag-hint" style="color: var(--text-light); font-size: 0.9rem; margin-bottom: 0.5rem;">輸入標題或內容後，系統會自動抓字推薦標籤。</div>
                    <div id="ask-tags" style="display: flex; flex-wrap: wrap; gap: 0.5rem;"></div>
                </div>

                <div class="form-group">
                    <label>緊急程度</label>
                    <input type="hidden" id="ask-urgency" value="normal">
                    <div style="display: flex; gap: 0.75rem; flex-wrap: wrap;">
                        <button type="button" class="btn btn-secondary btn-sm urgency-btn is-active" data-urgency="normal">一般</button>
                        <button type="button" class="btn btn-secondary btn-sm urgency-btn" data-urgency="important">重要</button>
                        <button type="button" class="btn btn-secondary btn-sm urgency-btn" data-urgency="urgent">緊急</button>
                    </div>
                </div>

                <div class="form-group">
                    <label>
                        <input type="checkbox" id="ask-anonymous">
                        匿名提問
                    </label>
                </div>

                <div style="display: flex; gap: 1rem;">
                    <button type="submit" class="btn btn-primary">發布</button>
                    <button type="button" class="btn btn-secondary" onclick="closeAskModal()">取消</button>
                </div>
            </form>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 社團活動資訊統整平台</p>
    </footer>

    <script src="../js/main.js?v=20260502f"></script>
    <script>
        let qaTags = [];
        let selectedQATagIds = new Set();
        const qaStatusOptions = [
            { key: '', label: '全部' },
            { key: 'open', label: '開放中' },
            { key: 'closed', label: '已關閉' }
        ];

        function getQAUrlParams() {
            const params = new URLSearchParams(window.location.search);
            return {
                search: params.get('search') || '',
                club_id: params.get('club_id') || '',
                status: params.get('status') || ''
            };
        }

        async function loadClubFilterOptions() {
            const clubSelect = document.getElementById('qa-club-filter');
            if (!clubSelect) return;

            try {
                const response = await APIClient.get('clubs.php?action=all_for_filter');
                if (!response.success) return;

                const clubs = response.data.clubs || [];
                const currentValue = clubSelect.value;
                clubSelect.innerHTML = '<option value="">全部社團</option>';

                clubs.forEach(club => {
                    const option = document.createElement('option');
                    option.value = club.club_id;
                    option.textContent = `${club.club_name || '-'}${club.category_name ? `（${club.category_name}）` : ''}`;
                    clubSelect.appendChild(option);
                });

                if (currentValue) {
                    clubSelect.value = currentValue;
                }
            } catch (error) {
                console.error('Error:', error);
            }
        }

        function normalizeKeyword(text) {
            return String(text || '').toLowerCase().replace(/[\s\p{P}\p{S}]+/gu, '');
        }

        function renderQATagSelector() {
            const container = document.getElementById('ask-tags');
            if (!container) return;

            if (!qaTags.length) {
                container.innerHTML = '<span style="color: var(--text-light); font-size: 0.9rem;">目前尚無可用標籤</span>';
                return;
            }

            container.innerHTML = qaTags.map(tag => {
                const isSelected = selectedQATagIds.has(Number(tag.qa_tag_id));
                const style = isSelected
                    ? 'background: var(--primary-color); color: white; border-color: var(--primary-color);'
                    : 'background: rgba(99, 102, 241, 0.08); color: var(--primary-color); border-color: rgba(99, 102, 241, 0.25);';
                return `<button type="button" class="tag" data-tag-id="${Number(tag.qa_tag_id) || 0}" style="margin: 0; border: 1px solid; cursor: pointer; ${style}">#${PageUtils.escapeHtml(tag.tag_name || '')}</button>`;
            }).join('');
        }

        function updateTagRecommendations() {
            const title = document.getElementById('ask-title').value || '';
            const content = document.getElementById('ask-content').value || '';
            const source = normalizeKeyword(`${title} ${content}`);
            const hint = document.getElementById('ask-tag-hint');

            selectedQATagIds = new Set();
            qaTags.forEach(tag => {
                const keyword = normalizeKeyword(tag.tag_name);
                if (keyword && source.includes(keyword)) {
                    selectedQATagIds.add(Number(tag.qa_tag_id));
                }
            });

            if (hint) {
                hint.textContent = selectedQATagIds.size > 0
                    ? `已抓到 ${selectedQATagIds.size} 個推薦標籤，可自行點擊增減。`
                    : '尚未抓到對應標籤，可手動點擊選擇。';
            }

            renderQATagSelector();
        }

        async function loadQATags() {
            try {
                const response = await APIClient.get('qa.php?action=tags');
                if (response.success) {
                    qaTags = response.data.tags || [];
                } else {
                    qaTags = [];
                }
            } catch (error) {
                console.error('Error:', error);
                qaTags = [];
            }

            renderQATagSelector();
        }

        async function loadQA() {
            try {
                const search = document.getElementById('qa-search').value.trim();
                const club_id = document.getElementById('qa-club-filter').value;
                const status = document.getElementById('qa-status-filter').value;
                let url = 'qa.php';
                const params = new URLSearchParams();
                if (search) params.append('search', search);
                if (club_id) params.append('club_id', club_id);
                if (status) params.append('status', status);
                if ([...params.keys()].length > 0) {
                    url += `?${params.toString()}`;
                }

                const response = await APIClient.get(url);
                if (response.success) {
                    renderQA(response.data.questions);
                } else {
                    document.getElementById('qa-container').innerHTML = '<p>載入失敗</p>';
                }
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('qa-container').innerHTML = '<p>發生錯誤</p>';
            }
        }

        function openQAAdvancedFilters() {
            const panel = document.getElementById('qa-advanced-filters');
            const btn = document.getElementById('qa-advanced-toggle-btn');
            if (!panel || !btn) return;
            panel.classList.add('is-open');
            panel.setAttribute('aria-hidden', 'false');
            btn.classList.add('is-active');
            btn.setAttribute('aria-expanded', 'true');
        }

        function closeQAAdvancedFilters() {
            const panel = document.getElementById('qa-advanced-filters');
            const btn = document.getElementById('qa-advanced-toggle-btn');
            if (!panel || !btn) return;
            panel.classList.remove('is-open');
            panel.setAttribute('aria-hidden', 'true');
            btn.classList.remove('is-active');
            btn.setAttribute('aria-expanded', 'false');
        }

        function hasQAAdvancedFilters() {
            const clubId = document.getElementById('qa-club-filter').value;
            const status = document.getElementById('qa-status-filter').value;
            return Boolean(clubId || status);
        }

        function resetQAFilters() {
            document.getElementById('qa-search').value = '';
            document.getElementById('qa-club-filter').value = '';
            document.getElementById('qa-status-filter').value = '';
            renderQAStatusFilters();
            loadQA();
        }

        function renderQAStatusFilters() {
            const container = document.getElementById('qa-status-filters');
            const statusSelect = document.getElementById('qa-status-filter');
            if (!container || !statusSelect) return;

            const current = statusSelect.value || '';
            container.innerHTML = '';

            qaStatusOptions.forEach(option => {
                const button = document.createElement('button');
                button.type = 'button';
                button.className = `badge badge-filter${current === option.key ? ' is-selected' : ''}`;
                button.textContent = option.label;
                button.addEventListener('click', () => {
                    if (statusSelect.value === option.key) return;
                    statusSelect.value = option.key;
                    renderQAStatusFilters();
                    loadQA();
                });
                container.appendChild(button);
            });
        }

        function renderQA(questions) {
            const container = document.getElementById('qa-container');
            container.innerHTML = '';

            if (questions.length === 0) {
                container.innerHTML = '<p style="text-align: center;">還沒有提問，成為第一個提問者吧！</p>';
                return;
            }

            questions.forEach(question => {
                const author = PageUtils.escapeHtml(question.author_name || question.user_name || question.display_name || '匿名用戶');
                const urgencyLabel = question.urgency_label || '一般';
                const safeQuestionTitle = PageUtils.escapeHtml(question.question_title || '未命名提問');
                const safeQuestionContent = PageUtils.escapeHtml(question.question_content || '');
                const safeUrgencyLabel = PageUtils.escapeHtml(urgencyLabel);
                const safeQaId = Number(question.qa_id) || 0;
                const safeClubName = PageUtils.escapeHtml(question.club_name || '未指定社團');
                const isSolved = question.status === 'closed' || Number(question.is_solved) === 1;
                const urgencyBadgeClass = question.urgency_level === 'urgent'
                    ? 'feed-item-badge--accent'
                    : (question.urgency_level === 'important' ? '' : 'feed-item-badge--neutral');

                const card = document.createElement('article');
                card.className = 'feed-item-card';
                card.innerHTML = `
                    <a href="qa-detail.html?id=${safeQaId}" class="feed-item-link">
                        <div class="feed-item-head">
                            <h3 class="feed-item-title">${safeQuestionTitle}</h3>
                            <span class="feed-item-badge ${isSolved ? 'feed-item-badge--neutral' : ''}">${isSolved ? '已解決' : '待解決'}</span>
                        </div>
                        <div class="feed-item-subtitle">${safeClubName} • ${author} • ${PageUtils.timeAgo(question.created_at)}</div>
                        <p class="feed-item-body">${safeQuestionContent}</p>
                        <div class="feed-item-meta">
                            <span>👁️ ${question.views_count} 次瀏覽</span>
                            <span>💬 ${question.replies_count} 個回覆</span>
                            ${question.urgency_level !== 'normal' ? `<span class="feed-item-badge ${urgencyBadgeClass}">${safeUrgencyLabel}</span>` : ''}
                        </div>
                    </a>
                `;
                container.appendChild(card);
            });
        }

        async function loadCategoriesForModal() {
            try {
                const response = await APIClient.get('clubs.php?action=categories');
                if (response.success) {
                    const select = document.getElementById('ask-category');
                    select.innerHTML = '<option value="">-- 請先選擇類別 --</option>';
                    (response.data.categories || []).forEach(category => {
                        const option = document.createElement('option');
                        option.value = category.category_id;
                        option.textContent = category.category_name;
                        select.appendChild(option);
                    });
                }
            } catch (error) {
                console.error('Error:', error);
            }
        }

        async function loadClubsByCategoryForModal(categoryId) {
            const clubSelect = document.getElementById('ask-club');
            clubSelect.innerHTML = '<option value="">載入中...</option>';
            clubSelect.disabled = true;

            if (!categoryId) {
                clubSelect.innerHTML = '<option value="">-- 請先選擇類別 --</option>';
                return;
            }

            try {
                const response = await APIClient.get(`clubs.php?action=by_category&category_id=${encodeURIComponent(categoryId)}`);
                if (!response.success) {
                    clubSelect.innerHTML = '<option value="">-- 載入失敗 --</option>';
                    return;
                }

                const clubs = response.data.clubs || [];
                if (clubs.length === 0) {
                    clubSelect.innerHTML = '<option value="">-- 此類別尚無可選社團 --</option>';
                    return;
                }

                clubSelect.innerHTML = '<option value="">-- 請選擇社團 --</option>';
                clubs.forEach(club => {
                    const option = document.createElement('option');
                    option.value = club.club_id;
                    option.textContent = `${club.club_name || '-'}${club.club_code ? `（${club.club_code}）` : ''}`;
                    clubSelect.appendChild(option);
                });
                clubSelect.disabled = false;
            } catch (error) {
                console.error('Error:', error);
                clubSelect.innerHTML = '<option value="">-- 載入失敗 --</option>';
            }
        }

        function setUrgencyLevel(level) {
            document.getElementById('ask-urgency').value = level;
            document.querySelectorAll('.urgency-btn').forEach(button => {
                const active = button.dataset.urgency === level;
                button.classList.toggle('btn-primary', active);
                button.classList.toggle('btn-secondary', !active);
                button.classList.toggle('is-active', active);
            });
        }

        function openAskModal() {
            ensureCanAsk().then(canAsk => {
                if (!canAsk) {
                    PageUtils.showAlert('請先登入', 'warning');
                    window.location.href = 'login.html';
                    return;
                }
                document.getElementById('ask-modal').style.display = 'flex';
            });
        }

        async function ensureCanAsk() {
            if (StorageUtils.isLoggedIn()) return true;
            try {
                const response = await APIClient.get('auth.php?action=current');
                if (response.success && response.data) {
                    StorageUtils.setUser({
                        user_id: response.data.user_id,
                        name: response.data.name,
                        email: response.data.email,
                        role: response.data.role,
                        student_id: response.data.student_id || null,
                        avatar_path: response.data.avatar_path || null
                    });
                    return true;
                }
            } catch (error) {
            }
            return false;
        }

        function closeAskModal() {
            document.getElementById('ask-modal').style.display = 'none';
            setUrgencyLevel('normal');
            selectedQATagIds = new Set();
            const hint = document.getElementById('ask-tag-hint');
            if (hint) {
                hint.textContent = '輸入標題或內容後，系統會自動抓字推薦標籤。';
            }
            renderQATagSelector();
        }

        document.getElementById('ask-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const club_id = document.getElementById('ask-club').value;
            const question_title = document.getElementById('ask-title').value;
            const question_content = document.getElementById('ask-content').value;
            const urgency_level = document.getElementById('ask-urgency').value;
            const is_anonymous = document.getElementById('ask-anonymous').checked;
            const tag_ids = Array.from(selectedQATagIds);

            try {
                const response = await APIClient.post('qa.php?action=create', {
                    club_id,
                    question_title,
                    question_content,
                    urgency_level,
                    is_anonymous,
                    tag_ids
                });

                if (response.success) {
                    PageUtils.showAlert('提問發布成功', 'success');
                    closeAskModal();
                    document.getElementById('ask-form').reset();
                    loadQA();
                } else {
                    PageUtils.showAlert(response.message, 'error');
                }
            } catch (error) {
                console.error('Error:', error);
                PageUtils.showAlert('發布失敗', 'error');
            }
        });

        window.addEventListener('DOMContentLoaded', async function() {
            const params = getQAUrlParams();
            document.getElementById('qa-search').value = params.search;
            document.getElementById('qa-club-filter').value = params.club_id;
            document.getElementById('qa-status-filter').value = params.status;

            await loadClubFilterOptions();
            renderQAStatusFilters();
            loadQA();
            loadCategoriesForModal();
            loadQATags();

            const advancedToggleBtn = document.getElementById('qa-advanced-toggle-btn');
            if (advancedToggleBtn) {
                advancedToggleBtn.addEventListener('click', () => {
                    const panel = document.getElementById('qa-advanced-filters');
                    if (!panel) return;
                    if (panel.classList.contains('is-open')) {
                        closeQAAdvancedFilters();
                    } else {
                        openQAAdvancedFilters();
                    }
                });
            }

            if (hasQAAdvancedFilters()) {
                openQAAdvancedFilters();
            } else {
                closeQAAdvancedFilters();
            }

            document.getElementById('ask-category').addEventListener('change', event => {
                loadClubsByCategoryForModal(event.target.value);
            });

            document.getElementById('ask-title').addEventListener('input', updateTagRecommendations);
            document.getElementById('ask-content').addEventListener('input', updateTagRecommendations);

            document.getElementById('ask-tags').addEventListener('click', event => {
                const button = event.target.closest('[data-tag-id]');
                if (!button) return;
                const tagId = Number(button.dataset.tagId);
                if (selectedQATagIds.has(tagId)) {
                    selectedQATagIds.delete(tagId);
                } else {
                    selectedQATagIds.add(tagId);
                }

                const hint = document.getElementById('ask-tag-hint');
                if (hint) {
                    hint.textContent = selectedQATagIds.size > 0
                        ? `目前已選 ${selectedQATagIds.size} 個標籤。`
                        : '尚未選擇標籤。';
                }

                renderQATagSelector();
            });

            document.querySelectorAll('.urgency-btn').forEach(button => {
                button.addEventListener('click', () => setUrgencyLevel(button.dataset.urgency));
            });
            setUrgencyLevel('normal');

            document.getElementById('qa-search-btn').addEventListener('click', () => {
                loadQA();
            });

            document.getElementById('qa-reset-btn').addEventListener('click', () => {
                resetQAFilters();
            });

            document.getElementById('qa-search').addEventListener('keydown', event => {
                if (event.key === 'Enter') {
                    event.preventDefault();
                    loadQA();
                }
            });

            document.getElementById('qa-status-filter').addEventListener('change', () => {
                renderQAStatusFilters();
                loadQA();
            });

            document.getElementById('qa-club-filter').addEventListener('change', () => {
                loadQA();
            });
        });
    </script>
</body>

</html>
