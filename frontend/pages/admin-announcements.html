<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>系統公告 — 管理員</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+TC:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../css/styles.css" />
    <link rel="stylesheet" href="../css/admin.css" />
</head>
<body class="admin-page admin-announcements-page">
    <header>
        <nav>
            <a href="admin-users.html" class="logo">輔大社團活動資訊系統<span class="logo__sub">FJCU CLUB ACTIVITY INFORMATION SYSTEM</span></a>
            <ul class="nav-links">
                <li><a href="admin-overview.html">系統總覽</a></li>
                <li><a href="admin-users.html">帳號管理</a></li>
                <li><a href="admin-clubs.html">社團管理</a></li>
                <li><a href="admin-reports.html">報告管理</a></li>
                <li><a href="admin-announcements.html">系統公告</a></li>
                <li><a href="admin-transfers.html">帳戶轉讓</a></li>
            </ul>
            <div class="nav-right">
                <button id="logout-btn" class="btn btn-secondary btn-sm" onclick="handleLogout()">登出</button>
                <span id="user-dropdown" style="display: none;"></span>
            </div>
        </nav>
    </header>

    <div id="alert-container"></div>

    <div class="container">
        <section class="card admin-panel">
            <div class="admin-panel-head">
                <h2>系統公告</h2>
                <span class="admin-panel-subtext">發布全站公告與置頂訊息</span>
            </div>
            <div class="admin-form-wrapper">
                <form id="create-announcement-form" class="admin-form-grid">
                    <input type="hidden" id="announcement-id" value="" />
                    <div class="form-field admin-span-2">
                        <label for="announcement-title">公告標題</label>
                        <input type="text" id="announcement-title" required />
                    </div>
                    <div class="form-field admin-span-2">
                        <label for="announcement-content">公告內容</label>
                        <textarea id="announcement-content" required></textarea>
                    </div>
                    <div class="form-field">
                        <label for="announcement-type">公告類型</label>
                        <select id="announcement-type">
                            <option value="important">重要</option>
                            <option value="event">活動</option>
                            <option value="maintenance">維護</option>
                            <option value="update">更新</option>
                        </select>
                    </div>
                    <div class="form-field admin-checkbox-wrap">
                        <label for="announcement-sticky">是否置頂</label>
                        <input type="checkbox" id="announcement-sticky" />
                        <button type="submit" id="announcement-submit-btn" class="btn btn-primary">發佈公告</button>
                        <button type="button" id="announcement-cancel-edit-btn" class="btn btn-secondary" style="display:none;">取消編輯</button>
                    </div>
                </form>
            </div>
            <div class="admin-table-controls">
                <div class="form-field">
                    <label for="announcements-search">關鍵字搜尋</label>
                    <input type="text" id="announcements-search" placeholder="標題、內容、類型" />
                </div>
                <div class="form-field">
                    <label for="announcements-sort">排序方式</label>
                    <select id="announcements-sort">
                        <option value="created_desc">最新發布</option>
                        <option value="created_asc">最舊發布</option>
                        <option value="pinned_first">置頂優先</option>
                    </select>
                </div>
            </div>
            <div id="announcements-list" class="admin-list"></div>
            <div class="admin-pagination" id="announcements-pagination"></div>
        </section>
    </div>

    <script src="../js/main.js?v=20260507"></script>
    <script>
        const PAGE_SIZE = 8;
        const ANNOUNCEMENT_TYPE_LABELS = { important: '重要', event: '活動', maintenance: '維護', update: '更新' };

        const announcementsState = { rows: [], query: '', sort: 'created_desc', page: 1, editingId: null };

        function escapeHtml(value) {
            return String(value ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }
        function toSearchableText(value) { return (value ?? '').toString().trim().toLowerCase(); }
        function paginateRows(rows, page) {
            const tot = Math.max(1, Math.ceil(rows.length / PAGE_SIZE));
            const cur = Math.min(Math.max(1, page), tot);
            const s = (cur - 1) * PAGE_SIZE;
            return { rows: rows.slice(s, s + PAGE_SIZE), totalPages: tot, currentPage: cur, totalRows: rows.length };
        }
        function formatDateTime(value) {
            if (!value) return '-';
            if (window.PageUtils && typeof PageUtils.formatDate === 'function') return PageUtils.formatDate(value);
            return new Intl.DateTimeFormat('zh-TW', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }).format(new Date(value));
        }
        function renderPagination(containerId, pageData, onPageChange) {
            const container = document.getElementById(containerId);
            if (!container) return;
            if (pageData.totalRows === 0) { container.innerHTML = '<span class="admin-page-meta">查無資料</span>'; return; }
            container.innerHTML = `
                <button class="btn btn-secondary btn-sm" ${pageData.currentPage === 1 ? 'disabled' : ''} data-page="prev">上一頁</button>
                <span class="admin-page-meta">第 ${pageData.currentPage} / ${pageData.totalPages} 頁，共 ${pageData.totalRows} 筆</span>
                <button class="btn btn-secondary btn-sm" ${pageData.currentPage === pageData.totalPages ? 'disabled' : ''} data-page="next">下一頁</button>
            `;
            container.querySelectorAll('button[data-page]').forEach(btn => {
                btn.addEventListener('click', () => onPageChange(btn.dataset.page === 'prev' ? pageData.currentPage - 1 : pageData.currentPage + 1));
            });
        }
        function renderEmptyState(container, title, description) {
            container.innerHTML = `<div class="empty-state"><div class="empty-state-illustration"></div><h4>${escapeHtml(title || '')}</h4><p>${escapeHtml(description || '')}</p></div>`;
        }

        function getFilteredSortedAnnouncements() {
            const query = toSearchableText(announcementsState.query);
            let rows = [...announcementsState.rows];
            if (query) {
                rows = rows.filter(item => {
                    const typeKey = item.announcement_type || item.type;
                    const typeLabel = ANNOUNCEMENT_TYPE_LABELS[typeKey] || typeKey;
                    return [item.title, item.content, typeLabel].some(v => toSearchableText(v).includes(query));
                });
            }
            const sortMap = {
                created_desc: (a, b) => new Date(b.created_at) - new Date(a.created_at),
                created_asc: (a, b) => new Date(a.created_at) - new Date(b.created_at),
                pinned_first: (a, b) => {
                    const pa = Boolean(a.is_pinned ?? a.is_sticky), pb = Boolean(b.is_pinned ?? b.is_sticky);
                    if (pa !== pb) return pb ? 1 : -1;
                    return new Date(b.created_at) - new Date(a.created_at);
                }
            };
            rows.sort(sortMap[announcementsState.sort] || sortMap.created_desc);
            return rows;
        }

        function renderAnnouncementsList() {
            const filtered = getFilteredSortedAnnouncements();
            const pageData = paginateRows(filtered, announcementsState.page);
            announcementsState.page = pageData.currentPage;
            const container = document.getElementById('announcements-list');
            container.innerHTML = '';
            if (pageData.rows.length === 0) {
                renderEmptyState(container, '目前沒有公告', '新增第一則公告，或改用其他排序方式查看。');
                renderPagination('announcements-pagination', pageData, nextPage => { announcementsState.page = nextPage; renderAnnouncementsList(); });
                return;
            }
            pageData.rows.forEach(item => {
                const typeKey = item.announcement_type || item.type;
                const isPinned = Boolean(item.is_pinned ?? item.is_sticky);
                const safeTitle = escapeHtml(item.title || '-');
                const safeType = escapeHtml(ANNOUNCEMENT_TYPE_LABELS[typeKey] || typeKey || '-');
                const safeContent = escapeHtml(item.content || '-');
                const safeCreatedAt = escapeHtml(formatDateTime(item.created_at));
                const safeId = Number(item.announcement_id) || 0;
                const card = document.createElement('section');
                card.className = `portal-section portal-section--dynamic${isPinned ? ' portal-section--pinned' : ''}`;
                card.innerHTML = `
                    <div class="portal-section-head">
                        <h4 class="portal-section-title">${safeTitle}</h4>
                        <div class="admin-item-badges">
                            ${isPinned ? '<span class="status-chip chip-warning">置頂</span>' : ''}
                            <span class="status-chip">${safeType}</span>
                        </div>
                    </div>
                    <p class="admin-item-content">${safeContent}</p>
                    <div class="admin-item-footer">
                        <span class="admin-item-time">${safeCreatedAt}</span>
                        <div class="row-actions">
                            <button class="btn btn-secondary btn-sm" data-announcement-edit="${safeId}">編輯</button>
                            ${isPinned ? `<button class="btn btn-secondary btn-sm" data-announcement-unpin="${safeId}">取消置頂</button>` : ''}
                            <button class="btn btn-secondary btn-sm" data-announcement-delete="${safeId}">刪除</button>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
            container.querySelectorAll('button[data-announcement-edit]').forEach(btn => btn.addEventListener('click', () => startAnnouncementEdit(btn.dataset.announcementEdit)));
            container.querySelectorAll('button[data-announcement-unpin]').forEach(btn => btn.addEventListener('click', async () => unpinAnnouncement(btn.dataset.announcementUnpin)));
            container.querySelectorAll('button[data-announcement-delete]').forEach(btn => btn.addEventListener('click', async () => deleteAnnouncement(btn.dataset.announcementDelete)));
            renderPagination('announcements-pagination', pageData, nextPage => { announcementsState.page = nextPage; renderAnnouncementsList(); });
        }

        async function loadAnnouncements() {
            const response = await APIClient.get('admin.php?action=announcements');
            if (!response.success) return console.error(response.message);
            announcementsState.rows = response.data.announcements || [];
            renderAnnouncementsList();
        }

        async function deleteAnnouncement(id) {
            if (!confirm('確定要刪除此公告嗎？')) return;
            const response = await APIClient.delete('admin.php?action=delete_announcement&id=' + id);
            if (response.success) {
                PageUtils.showAlert('公告刪除成功', 'success');
                if (announcementsState.editingId === Number(id)) resetAnnouncementFormMode();
                loadAnnouncements();
            } else PageUtils.showAlert('刪除公告失敗：' + response.message, 'error');
        }

        function resetAnnouncementFormMode() {
            announcementsState.editingId = null;
            document.getElementById('announcement-id').value = '';
            document.getElementById('announcement-submit-btn').textContent = '發佈公告';
            document.getElementById('announcement-cancel-edit-btn').style.display = 'none';
            document.getElementById('create-announcement-form').reset();
        }

        function startAnnouncementEdit(id) {
            const announcementId = Number(id || 0);
            if (!announcementId) return;
            const item = announcementsState.rows.find(row => Number(row.announcement_id) === announcementId);
            if (!item) return;
            announcementsState.editingId = announcementId;
            document.getElementById('announcement-id').value = String(announcementId);
            document.getElementById('announcement-title').value = item.title || '';
            document.getElementById('announcement-content').value = item.content || '';
            document.getElementById('announcement-type').value = item.announcement_type || item.type || 'important';
            document.getElementById('announcement-sticky').checked = Boolean(item.is_pinned ?? item.is_sticky);
            document.getElementById('announcement-submit-btn').textContent = '儲存變更';
            document.getElementById('announcement-cancel-edit-btn').style.display = 'inline-flex';
            document.getElementById('announcement-title').focus();
        }

        async function unpinAnnouncement(id) {
            const announcementId = Number(id || 0);
            if (!announcementId) return;
            const response = await APIClient.post('admin.php?action=unpin_announcement', { announcement_id: announcementId });
            if (response.success) { PageUtils.showAlert('公告已取消置頂', 'success'); loadAnnouncements(); }
            else PageUtils.showAlert('取消置頂失敗：' + response.message, 'error');
        }

        document.getElementById('announcements-search').addEventListener('input', event => { announcementsState.query = event.target.value; announcementsState.page = 1; renderAnnouncementsList(); });
        document.getElementById('announcements-sort').addEventListener('change', event => { announcementsState.sort = event.target.value; announcementsState.page = 1; renderAnnouncementsList(); });
        document.getElementById('announcement-cancel-edit-btn').addEventListener('click', () => resetAnnouncementFormMode());

        document.getElementById('create-announcement-form').addEventListener('submit', async event => {
            event.preventDefault();
            const editingId = Number(document.getElementById('announcement-id').value || 0);
            const payload = {
                title: document.getElementById('announcement-title').value,
                content: document.getElementById('announcement-content').value,
                type: document.getElementById('announcement-type').value,
                is_sticky: document.getElementById('announcement-sticky').checked ? 1 : 0
            };
            if (editingId) payload.announcement_id = editingId;
            const action = editingId ? 'update_announcement' : 'create_announcement';
            const response = await APIClient.post('admin.php?action=' + action, payload);
            if (response.success) { PageUtils.showAlert(editingId ? '公告更新成功' : '公告發佈成功', 'success'); resetAnnouncementFormMode(); loadAnnouncements(); }
            else PageUtils.showAlert((editingId ? '更新公告失敗：' : '發佈公告失敗：') + response.message, 'error');
        });

        loadAnnouncements();
    </script>
    <footer>
        <p>© 2026 社團活動資訊統整平台 - 打造最好的校園社團生態</p>
    </footer>
</body>
</html>
