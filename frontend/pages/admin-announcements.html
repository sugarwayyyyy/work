<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-store" />
    <title>系統公告 — 管理員</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+TC:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../css/styles.css?v=20260530" />
    <link rel="stylesheet" href="../css/admin.css?v=20260604p" />
</head>
<body class="admin-page admin-shell admin-announcements-page">
    <header>
        <nav>
            <a href="admin-users.html" class="logo">輔大社團活動資訊系統<span class="logo__sub">FJCU CLUB ACTIVITY INFORMATION SYSTEM</span></a>
            <ul class="nav-links">
                <li><a href="admin-overview.html">系統總覽</a></li>
                <li><a href="admin-users.html">帳號管理</a></li>
                <li><a href="admin-clubs.html">社團管理</a></li>
                <li><a href="admin-reports.html">報告管理</a></li>
                <li><a href="admin-announcements.html">系統公告</a></li>
                <li><a href="admin-transfers.html">帳戶轉讓</a></li>
                <li><a href="messages.html">私訊</a></li>
            </ul>
            <div class="nav-right">
                <button id="logout-btn" class="btn btn-secondary btn-sm" onclick="handleLogout()">登出</button>
                <span id="user-dropdown" style="display: none;"></span>
            </div>
        </nav>
    </header>

    <div id="alert-container"></div>

    <div class="container club-list-page">
        <section class="admin-panel">
            <div class="admin-panel-head">
                <h2>系統公告</h2>
                <span class="admin-panel-subtext">發布全站公告與置頂訊息</span>
            </div>
            <div class="admin-form-wrapper">
                <form id="create-announcement-form" class="admin-form-grid">
                    <input type="hidden" id="announcement-id" value="" />
                    <div class="form-field admin-span-2">
                        <label for="announcement-title">公告標題</label>
                        <input type="text" id="announcement-title" required />
                    </div>
                    <div class="form-field admin-span-2">
                        <label for="announcement-content">公告內容</label>
                        <textarea id="announcement-content" required></textarea>
                    </div>
                    <div class="form-field">
                        <label for="announcement-type">公告類型</label>
                        <select id="announcement-type">
                            <option value="important">重要</option>
                            <option value="event">活動</option>
                            <option value="maintenance">維護</option>
                            <option value="update">更新</option>
                        </select>
                    </div>
                    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(219px,1fr));gap:0.75rem;">
                        <div class="form-field" style="margin-bottom:0;">
                            <label for="announcement-start-date">排程發布（選填）</label>
                            <input type="datetime-local" id="announcement-start-date" />
                        </div>
                        <div class="form-field" style="margin-bottom:0;">
                            <label for="announcement-end-date">自動到期（選填）</label>
                            <input type="datetime-local" id="announcement-end-date" />
                        </div>
                    </div>
                    <div class="form-field admin-checkbox-wrap">
                        <label for="announcement-sticky">是否置頂</label>
                        <input type="checkbox" id="announcement-sticky" />
                        <button type="submit" id="announcement-submit-btn" class="btn btn-primary">發佈公告</button>
                        <button type="button" id="announcement-cancel-edit-btn" class="btn btn-secondary" style="display:none;">取消編輯</button>
                    </div>
                </form>
            </div>
            <div class="admin-table-controls">
                <div class="form-field">
                    <label for="announcements-search">關鍵字搜尋</label>
                    <input type="text" id="announcements-search" placeholder="標題、內容、類型" />
                </div>
                <div class="form-field">
                    <label for="announcements-sort">排序方式</label>
                    <select id="announcements-sort">
                        <option value="created_desc">最新發布</option>
                        <option value="created_asc">最舊發布</option>
                        <option value="pinned_first">置頂優先</option>
                    </select>
                </div>
            </div>
            <div id="announcements-list" class="admin-list"></div>
            <div class="admin-pagination" id="announcements-pagination"></div>
        </section>
    </div>

    <script src="../js/main.js?v=20260607a"></script>
    <script src="../js/admin-announcements.js?v=20260528"></script>
    <footer>
        <p>&copy; 2026 社團活動資訊統整平台 - 打造最好的校園社團生態</p>
    </footer>
</body>
</html>
