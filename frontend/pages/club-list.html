<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>社團探索 - 校園社團平台</title>
    <link rel="stylesheet" href="../css/styles.css?v=20260502j">
    <link rel="stylesheet" href="../css/club-list.css?v=20260502j">
    <link rel="stylesheet" href="../css/home.css?v=20260502j">
</head>

<body>
    <header>
        <nav>
            <a href="../index.html" class="logo">輔大社團活動資訊系統<span class="logo__sub">FJCU CLUB ACTIVITY INFORMATION SYSTEM</span></a>
            <ul class="nav-links">
                <li><a href="../index.html">首頁</a></li>
                <li><a href="club-list.html" class="active">社團</a></li>
                <li><a href="events.html">活動</a></li>
                <li><a href="qa.html">提問</a></li>
            </ul>
            <div class="nav-right">
                <button id="login-btn" class="btn btn-primary btn-sm" onclick="window.location.href = 'login.html'">登入</button>
                <button id="logout-btn" class="btn btn-secondary btn-sm" onclick="handleLogout()" style="display: none;">登出</button>
                <span id="user-dropdown" style="display: none;"></span>
            </div>
        </nav>
    </header>

    <div id="alert-container"></div>

    <div class="club-list-page">
        <div class="container club-list-container">

            <!-- 雙欄探索器：左側篩選 + 右側結果 -->
            <div class="club-explorer-layout">

                <!-- 左側：篩選欄（sticky） -->
                <aside class="club-filter-column">
                    <div class="club-filter-card filter-card">
                        <div class="filter-card__header">
                            <div>
                                <div class="filter-card__title">篩選社團</div>
                                <div class="filter-card__subtitle">縮小範圍，找到最適合你的社團。</div>
                            </div>
                            <button type="button" id="layout-toggle-btn" class="club-layout-toggle-btn" aria-label="切換篩選欄位置"></button>
                        </div>
                        <div class="filter-card__body">
                            <div class="club-filter-topbar">
                                <div class="filter-field club-filter-keyword">
                                    <label for="club-search">社團關鍵字</label>
                                    <input id="club-search" type="text" placeholder="輸入名稱或關鍵字">
                                </div>
                                <button type="button" class="btn btn-primary btn-sm" onclick="loadClubs()">篩選</button>
                                <button type="button" class="btn btn-secondary btn-sm" onclick="resetFilters()">重製</button>
                                <button
                                    type="button"
                                    id="club-advanced-toggle-btn"
                                    class="club-filter-toggle-btn"
                                    aria-expanded="false"
                                    aria-controls="club-advanced-filters"
                                >
                                    進階篩選 <span class="toggle-arrow">&#9660;</span>
                                </button>
                            </div>

                            <div id="club-advanced-filters" class="club-advanced-filters" aria-hidden="true">
                                <div class="filter-grid club-filter-grid club-filter-grid--advanced">
                                    <div class="filter-field">
                                        <label for="category-filter">社團類別</label>
                                        <select id="category-filter">
                                            <option value="">全部類別</option>
                                        </select>
                                    </div>
                                    <div class="filter-field">
                                        <label for="club-filter">社團</label>
                                        <select id="club-filter" disabled>
                                            <option value="">請先選擇類別</option>
                                        </select>
                                    </div>
                                    <div class="filter-field">
                                        <label for="club-fee-range">社費範圍</label>
                                        <select id="club-fee-range">
                                            <option value="">全部</option>
                                            <option value="0-500">0–500 元</option>
                                            <option value="500-1000">500–1000 元</option>
                                            <option value="1000+">1000 元以上</option>
                                        </select>
                                    </div>
                                </div>

                                <div class="filter-toolbar">
                                    <div class="filter-toolbar__group">
                                        <span class="filter-toolbar__label">熱門標籤</span>
                                        <p id="popular-tags-helper" class="filter-hint">多選標籤採 OR 排序：符合較多標籤的社團排前面。</p>
                                        <div id="popular-tags" class="chip-cloud"></div>
                                    </div>
                                    <div class="filter-toolbar__group subsearch-box">
                                        <label for="tag-search-input">標籤副查詢</label>
                                        <input id="tag-search-input" type="text" placeholder="輸入標籤關鍵字...">
                                        <div id="tag-search-results" class="chip-cloud"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </aside>

                <!-- 右側：結果欄 -->
                <main class="club-results-column">

                    <!-- 結果摘要列 -->
                    <div class="club-results-summary">
                        <div class="club-results-summary__head">
                            <span class="club-results-summary__title" id="result-count">搜尋中...</span>
                            <span class="club-results-summary__meta">依相關度排序</span>
                        </div>
                        <div class="club-results-summary__chips" id="active-filters-chips"></div>
                    </div>

                    <!-- 社團卡片清單 -->
                    <section class="portal-section portal-section--dynamic">
                        <div class="portal-section-head">
                            <h2 class="portal-section-title">社團列表</h2>
                            <span id="results-page-info" style="font-size:0.78rem;color:var(--text-muted);"></span>
                        </div>

                        <div id="clubs-container" class="feed-stream-list club-list-feed">
                            <div class="club-state">
                                <div class="loading">
                                    <div class="spinner"></div>
                                </div>
                            </div>
                        </div>

                        <div class="feed-footer">
                            <div id="pagination-container"></div>
                        </div>
                    </section>
                </main>
            </div>

        </div>
    </div>

    <footer>
        <p>&copy; 2026 社團活動資訊統整平台 - 打造最好的校園社團生態</p>
    </footer>

    <script src="../js/main.js?v=20260502j"></script>
    <script src="../js/club-list.js?v=20260528"></script>
</body>

</html>
