<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-store" />
    <title>報告管理 — 管理員</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+TC:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../css/styles.css?v=20260530" />
    <link rel="stylesheet" href="../css/admin.css?v=20260604p" />
    <link rel="stylesheet" href="../css/home.css" />
    <link rel="stylesheet" href="../css/admin-reports.css?v=20260528" />
</head>
<body class="admin-page admin-shell admin-reports-page">
    <header>
        <nav>
            <a href="admin-users.html" class="logo">輔大社團活動資訊系統<span class="logo__sub">FJCU CLUB ACTIVITY INFORMATION SYSTEM</span></a>
            <ul class="nav-links">
                <li><a href="admin-overview.html">系統總覽</a></li>
                <li><a href="admin-users.html">帳號管理</a></li>
                <li><a href="admin-clubs.html">社團管理</a></li>
                <li><a href="admin-reports.html">報告管理</a></li>
                <li><a href="admin-announcements.html">系統公告</a></li>
                <li><a href="admin-transfers.html">帳戶轉讓</a></li>
                <li><a href="messages.html">私訊</a></li>
            </ul>
            <div class="nav-right">
                <button id="logout-btn" class="btn btn-secondary btn-sm" onclick="handleLogout()">登出</button>
                <span id="user-dropdown" style="display: none;"></span>
            </div>
        </nav>
    </header>

    <div id="alert-container"></div>

    <div class="container club-list-page">
        <section class="portal-section portal-section--dynamic">
            <div class="portal-section-head">
                <h2 class="portal-section-title">報告管理</h2>
                <div class="feed-tabs" role="tablist" aria-label="報告分類">
                    <button type="button" class="feed-tab is-active" data-sub-tab="feedback" role="tab" aria-selected="true">用戶回饋</button>
                    <button type="button" class="feed-tab"           data-sub-tab="cases"    role="tab" aria-selected="false">檢舉工單</button>
                </div>
            </div>
            <div class="feed-panels">
                <div id="reports-panel-feedback" class="feed-panel is-active"></div>
                <div id="reports-panel-cases"    class="feed-panel"></div>
            </div>
        </section>
    </div>


    <!-- 檢舉處理 Modal -->
    <div id="report-action-modal" role="dialog" aria-modal="true">
        <div class="report-modal-box">
            <p class="report-modal-title" id="report-modal-title">處理工單</p>
            <p class="report-modal-sub" id="report-modal-sub"></p>
            <textarea class="report-modal-textarea" id="report-modal-note" placeholder="輸入備註…"></textarea>
            <div class="report-modal-actions">
                <button class="btn btn-secondary btn-sm" onclick="closeReportModal()">取消</button>
                <button class="btn btn-primary btn-sm" id="report-modal-confirm">確認</button>
            </div>
        </div>
    </div>

    <script src="../js/main.js?v=20260604c"></script>
    <script src="../js/admin-reports.js?v=20260603"></script>
    <footer>
        <p>&copy; 2026 社團活動資訊統整平台 - 打造最好的校園社團生態</p>
    </footer>
</body>
</html>
