<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>私訊 - 社團平台</title>
    <link rel="stylesheet" href="../css/styles.css?v=20260502k">
    <link rel="stylesheet" href="../css/messages.css?v=20260528">
</head>
<body>
    <header>
        <nav>
            <a href="../index.html" class="logo">輔大社團活動資訊系統<span class="logo__sub">FJCU CLUB ACTIVITY INFORMATION SYSTEM</span></a>
            <ul class="nav-links">
                <li><a href="../index.html">首頁</a></li>
                <li><a href="club-list.html">社團</a></li>
                <li><a href="events.html">活動</a></li>
                <li><a href="qa.html">提問</a></li>
                <li><a href="messages.html">私訊</a></li>
            </ul>
            <div class="nav-right">
                <button id="login-btn" class="btn btn-primary btn-sm" onclick="window.location.href='login.html'" style="display:none;">登入</button>
                <button id="logout-btn" class="btn btn-secondary btn-sm" onclick="handleLogout()" style="display:none;">登出</button>
                <span id="user-dropdown" style="display:none;"></span>
            </div>
        </nav>
    </header>

    <div id="alert-container"></div>

    <!-- search user modal -->
    <div class="msg-modal-overlay" id="search-modal" hidden>
        <div class="msg-modal">
            <button class="msg-modal-close" onclick="closeSearchModal()">✕</button>
            <div class="msg-modal-title">新增對話</div>
            <div class="msg-search-row">
                <input class="msg-search-input" id="search-input" type="text" placeholder="輸入用戶 ID 或姓名..." autocomplete="off">
                <button class="btn btn-primary btn-sm" onclick="doSearch()">搜尋</button>
            </div>
            <div class="msg-search-results" id="search-results"></div>
        </div>
    </div>

    <div class="msg-shell">
        <!-- sidebar -->
        <div class="msg-sidebar">
            <div class="msg-sidebar-inner">
                <div class="msg-sidebar-head">
                    <span class="msg-sidebar-title">私訊</span>
                    <button class="msg-new-btn" title="新增對話" onclick="openSearchModal()">
                        <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
                            <line x1="10" y1="4" x2="10" y2="16"/><line x1="4" y1="10" x2="16" y2="10"/>
                        </svg>
                    </button>
                </div>
                <!-- Bot is always at the top, hardcoded -->
                <div class="msg-bot-item" id="bot-item" onclick="openBotConversation()">
                    <div class="msg-bot-avatar">🤖</div>
                    <div class="msg-conv-info">
                        <div class="msg-conv-name">平台機器人<span class="msg-bot-badge">BOT</span></div>
                        <div class="msg-conv-preview" id="bot-preview">載入中...</div>
                    </div>
                </div>
                <!-- Club admin: forms download (hidden until role confirmed) -->
                <div class="msg-bot-item" id="forms-item" onclick="openFormsPanel()" style="display:none;">
                    <div class="msg-bot-avatar" style="background:linear-gradient(135deg,#6366f1,#4f46e5);">📋</div>
                    <div class="msg-conv-info">
                        <div class="msg-conv-name">課指組表單下載</div>
                        <div class="msg-conv-preview">輔大課外活動指導組表單</div>
                    </div>
                </div>
                <!-- Notepad is second hardcoded item -->
                <div class="msg-bot-item" id="notepad-item" onclick="openNotepad()">
                    <div class="msg-bot-avatar" style="background:linear-gradient(135deg,#f59e0b,#d97706);">📝</div>
                    <div class="msg-conv-info">
                        <div class="msg-conv-name">記事本</div>
                        <div class="msg-conv-preview">個人備忘筆記</div>
                    </div>
                </div>
                <div class="msg-conv-list" id="conv-list">
                    <div class="msg-empty-conv">載入中...</div>
                </div>
            </div>
            <div class="sidebar-resize-handle" id="sidebar-resize-handle"></div>
            <button class="sidebar-tab" onclick="toggleSidebar()" title="收合／展開側欄">
                <svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 18 9 12 15 6"/>
                </svg>
            </button>
        </div>

        <!-- chat panel -->
        <div class="msg-panel">
            <div class="msg-panel-head" id="panel-head" style="display:none;">
                <button class="msg-back-btn" onclick="showMobileSidebar()" title="返回">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="15 18 9 12 15 6"/>
                    </svg>
                </button>
                <div class="msg-conv-avatar" id="panel-avatar"></div>
                <div class="msg-panel-name" id="panel-name"></div>
            </div>
            <div class="msg-messages" id="messages-area">
                <div class="msg-placeholder">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                    </svg>
                    <span>選擇一個對話，或點擊 ＋ 開始新對話</span>
                </div>
            </div>
            <div id="reply-bar">
                <span style="color:var(--color-primary-400,#60a5fa);font-size:1rem;flex-shrink:0">↩</span>
                <div style="flex:1;overflow:hidden">
                    <div id="reply-bar-name" style="font-weight:600;font-size:0.78rem;color:var(--color-primary-400,#60a5fa);white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></div>
                    <div id="reply-bar-text" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></div>
                </div>
                <button id="reply-cancel-btn" onclick="cancelReply()">✕</button>
            </div>
            <div class="msg-send-bar" id="send-bar" style="display:none;">
                <textarea class="msg-textarea" id="msg-input" rows="1" placeholder="輸入訊息..." maxlength="2000"></textarea>
                <button class="msg-send-btn" id="send-btn" title="傳送" onclick="sendMessage()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <script src="../js/main.js?v=20260510"></script>
    <script src="../js/messages.js?v=20260528"></script>
</body>
</html>
