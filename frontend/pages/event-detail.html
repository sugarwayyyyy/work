<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>活動詳情 - 社團平台</title>
    <link rel="stylesheet" href="../css/styles.css?v=20260530">
</head>

<body>
    <header>
        <nav>
            <a href="../index.html" class="logo">輔大社團活動資訊系統<span class="logo__sub">FJCU CLUB ACTIVITY INFORMATION SYSTEM</span></a>
            <ul class="nav-links">
                <li><a href="../index.html">首頁</a></li>
                <li><a href="club-list.html">社團</a></li>
                <li><a href="events.html">活動</a></li>
                <li><a href="qa.html">提問</a></li>
            </ul>
            <div class="nav-right">
                <button id="login-btn" class="btn btn-primary btn-sm" onclick="window.location.href = 'login.html'">登入</button>
                <button id="logout-btn" class="btn btn-secondary btn-sm" onclick="handleLogout()" style="display: none;">登出</button>
                <span id="user-dropdown" style="display: none;"></span>
            </div>
        </nav>
    </header>

    <div id="alert-container"></div>

    <div class="container">
        <div id="loading" class="loading" style="display: block;">
            <div class="spinner"></div>
            <p>載入活動詳情...</p>
        </div>

        <div id="event-detail" style="display: none;">

            <!-- ── Hero ──────────────────────────────────── -->
            <div class="event-hero">
                <h1 id="event-title" class="event-hero__title"></h1>
                <div class="event-hero__meta">
                    <span id="event-club" class="badge"></span>
                    <span id="event-date"></span>
                    <span id="event-location"></span>
                </div>
                <div id="event-last-updated" class="event-hero__updated">最新上傳時間：-</div>
            </div>

            <!-- ── Two-column layout ──────────────────────── -->
            <div class="event-layout">

                <!-- Main column -->
                <div class="event-main">

                    <!-- Poster carousel -->
                    <div id="event-poster-section" style="display: none; margin-bottom: 2rem;">
                        <div class="ig-carousel" id="event-poster-carousel">
                            <div class="ig-carousel__track" id="event-poster-track"></div>
                            <button class="ig-carousel__btn ig-carousel__btn--prev" id="poster-prev" aria-label="上一張">&#8249;</button>
                            <button class="ig-carousel__btn ig-carousel__btn--next" id="poster-next" aria-label="下一張">&#8250;</button>
                            <div class="ig-carousel__dots" id="poster-dots"></div>
                            <div class="ig-carousel__counter" id="poster-counter"></div>
                        </div>
                    </div>

                    <!-- Description -->
                    <section class="event-section">
                        <h3 class="event-section__title">活動描述</h3>
                        <p id="event-description" class="event-section__body"></p>
                    </section>

                    <!-- Participants (admins only) -->
                    <section class="event-section" id="participants-card" style="display: none;">
                        <h3 class="event-section__title">參與者列表</h3>
                        <div id="participants-list"><p>載入中...</p></div>
                    </section>

                    <!-- Comments -->
                    <section class="event-section">
                        <div class="event-comments-head">
                            <h3 class="event-section__title">活動評論</h3>
                            <span id="comments-rating-summary" class="event-comments-rating">⭐ 0.0（0 人評分）</span>
                        </div>
                        <div id="comment-form-hint" style="display: none; margin-bottom: 1.25rem; color: var(--text-light);"></div>
                        <div id="comment-form" style="display: none; margin-bottom: 2rem;">
                            <h4>留下您的評論</h4>
                            <form id="add-comment-form">
                                <div class="form-group">
                                    <label>評分</label>
                                    <div id="rating-stars">
                                        <span class="rating-star" data-rating="1">★</span>
                                        <span class="rating-star" data-rating="2">★</span>
                                        <span class="rating-star" data-rating="3">★</span>
                                        <span class="rating-star" data-rating="4">★</span>
                                        <span class="rating-star" data-rating="5">★</span>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label for="comment-content">評論內容</label>
                                    <textarea id="comment-content" rows="4" placeholder="分享您的活動體驗..." required></textarea>
                                </div>
                                <button type="submit" class="btn btn-primary">提交評論</button>
                            </form>
                        </div>
                        <div id="comments-list"><p>載入中...</p></div>
                    </section>
                </div>

                <!-- Sidebar -->
                <aside class="event-sidebar">
                    <!-- Registration CTA -->
                    <div class="event-sidebar-block event-reg-block">
                        <div class="event-reg-meta">
                            <span id="registered-count">0</span> 人已報名 &nbsp;·&nbsp; 名額 <span id="max-participants">0</span>
                        </div>
                        <div class="event-reg-status"><span id="event-status" class="badge">進行中</span></div>
                        <div id="registration-section" style="margin-top: 1rem;">
                            <button id="register-btn" class="btn btn-primary" style="display: none; width: 100%;">報名參加</button>
                            <button id="unregister-btn" class="btn btn-secondary" style="display: none; width: 100%;">取消報名</button>
                            <p id="registration-message" style="color: var(--text-light); margin-top: 0.5rem; font-size: 0.875rem;"></p>
                        </div>
                    </div>

                    <div class="event-sidebar-block">
                        <h4 class="event-sidebar-block__title">活動資訊</h4>
                        <div class="event-info-list">
                            <div class="event-info-item">
                                <span class="event-info-item__label">📅 日期時間</span>
                                <span id="event-datetime-detail" class="event-info-item__val"></span>
                            </div>
                            <div class="event-info-item">
                                <span class="event-info-item__label">📍 地點</span>
                                <div id="event-location-box">
                                    <div id="event-location-detail" class="event-info-item__val"></div>
                                    <div id="event-location-actions" style="display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.5rem;"></div>
                                </div>
                            </div>
                            <div class="event-info-item">
                                <span class="event-info-item__label">💰 費用</span>
                                <span id="event-fee" class="event-info-item__val">免費</span>
                            </div>
                            <div class="event-info-item">
                                <span class="event-info-item__label">📞 聯絡方式</span>
                                <span id="event-contact" class="event-info-item__val"></span>
                            </div>
                            <div class="event-info-item">
                                <span class="event-info-item__label">📅 加入日曆</span>
                                <div style="display: flex; flex-direction: column; gap: 0.5rem; margin-top: 0.4rem;">
                                    <button id="google-calendar-btn" class="btn btn-secondary btn-sm" onclick="addToGoogleCalendar()">📅 Google 日曆</button>
                                    <button id="apple-calendar-btn" class="btn btn-secondary btn-sm" onclick="addToAppleCalendar()">📱 Apple 日曆</button>
                                    <button id="outlook-calendar-btn" class="btn btn-secondary btn-sm" onclick="addToOutlookCalendar()">💼 Outlook 日曆</button>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="event-sidebar-block">
                        <h4 class="event-sidebar-block__title">關於主辦社團</h4>
                        <div id="club-info"><p>載入中...</p></div>
                    </div>
                </aside>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 社團活動資訊統整平台 - 打造最好的校園社團生態</p>
    </footer>

    <script src="../js/main.js?v=20260604c"></script>
    <script src="../js/event-detail.js?v=20260528"></script>
</body>

</html>
