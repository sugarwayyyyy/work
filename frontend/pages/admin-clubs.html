<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>社團管理 — 管理員</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+TC:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../css/styles.css" />
    <link rel="stylesheet" href="../css/admin.css" />
</head>
<body class="admin-page admin-clubs-page">
    <header>
        <nav>
            <a href="admin-users.html" class="logo">輔大社團活動資訊系統<span class="logo__sub">FJCU CLUB ACTIVITY INFORMATION SYSTEM</span></a>
            <ul class="nav-links">
                <li><a href="admin-overview.html">系統總覽</a></li>
                <li><a href="admin-users.html">帳號管理</a></li>
                <li><a href="admin-clubs.html">社團管理</a></li>
                <li><a href="admin-reports.html">報告管理</a></li>
                <li><a href="admin-announcements.html">系統公告</a></li>
                <li><a href="admin-transfers.html">帳戶轉讓</a></li>
                <li><a href="messages.html">私訊</a></li>
            </ul>
            <div class="nav-right">
                <button id="logout-btn" class="btn btn-secondary btn-sm" onclick="handleLogout()">登出</button>
                <span id="user-dropdown" style="display: none;"></span>
            </div>
        </nav>
    </header>

    <div id="alert-container"></div>

    <div id="club-management-section" class="user-edit-modal" role="dialog" aria-modal="true" aria-labelledby="club-edit-title">
        <div class="user-edit-modal-content" style="width:min(860px,100%); overflow-y:auto;">
            <div class="user-edit-modal-header">
                <h3 id="club-edit-title">編輯社團資料</h3>
                <button type="button" class="csm-close" id="club-edit-close">&times;</button>
            </div>
            <form id="edit-club-detail-form" class="admin-form-grid user-edit-modal-body">
                <input type="hidden" id="edit-club-id">
                <div class="form-field">
                    <label for="edit-club-code">社團代碼 <span class="required">*</span></label>
                    <input type="text" id="edit-club-code" required>
                </div>
                <div class="form-field">
                    <label for="edit-club-name">社團名稱 <span class="required">*</span></label>
                    <input type="text" id="edit-club-name" required>
                </div>
                <div class="form-field">
                    <label for="edit-club-category">社團類別</label>
                    <select id="edit-club-category">
                        <option value="">不限 / 未設定</option>
                    </select>
                </div>
                <div class="form-field">
                    <label for="edit-founding-year">成立年份</label>
                    <input type="number" id="edit-founding-year" min="1900" max="2100" placeholder="例：2015">
                </div>
                <div class="form-field">
                    <label for="edit-contact-email">聯絡信箱</label>
                    <input type="email" id="edit-contact-email">
                </div>
                <div class="form-field">
                    <label for="edit-contact-phone">聯絡電話</label>
                    <input type="tel" id="edit-contact-phone">
                </div>
                <div class="form-field admin-span-2">
                    <label>社課時間</label>
                    <input type="hidden" id="edit-meeting-time">
                    <div style="display:flex;flex-wrap:wrap;gap:1rem;align-items:flex-end;margin-top:0.25rem;">
                        <div>
                            <div style="font-size:0.75rem;color:var(--text-light);margin-bottom:0.25rem;">上課日</div>
                            <select id="edit-club-meeting-day">
                                <option value="每週一">每週一</option>
                                <option value="每週二">每週二</option>
                                <option value="每週三">每週三</option>
                                <option value="每週四">每週四</option>
                                <option value="每週五">每週五</option>
                                <option value="每週六">每週六</option>
                                <option value="每週日">每週日</option>
                            </select>
                        </div>
                        <div style="display:flex;align-items:flex-end;gap:0.5rem;">
                            <div>
                                <div style="font-size:0.75rem;color:var(--text-light);margin-bottom:0.25rem;">開始</div>
                                <div style="display:flex;gap:0.25rem;">
                                    <select id="edit-meeting-start-hour"></select>
                                    <select id="edit-meeting-start-minute">
                                        <option value="00">00</option>
                                        <option value="30">30</option>
                                    </select>
                                </div>
                            </div>
                            <span style="padding-bottom:0.4rem;font-weight:600;">~</span>
                            <div>
                                <div style="font-size:0.75rem;color:var(--text-light);margin-bottom:0.25rem;">結束</div>
                                <div style="display:flex;gap:0.25rem;">
                                    <select id="edit-meeting-end-hour"></select>
                                    <select id="edit-meeting-end-minute">
                                        <option value="00">00</option>
                                        <option value="30">30</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>
                    <small style="display:block;margin-top:0.25rem;color:var(--text-light);">24 小時制，分鐘僅能選整點或半點。</small>
                </div>
                <div class="form-field admin-span-2">
                    <label for="edit-meeting-location">社課地點</label>
                    <input type="text" id="edit-meeting-location" placeholder="例：第一教學大樓 305 教室">
                </div>
                <div class="form-field">
                    <label for="edit-club-fee">社費（入會費 / 年費）</label>
                    <input type="number" id="edit-club-fee" min="0" placeholder="0">
                </div>
                <div class="form-field">
                    <label for="edit-club-fee-semester">學期費</label>
                    <input type="number" id="edit-club-fee-semester" min="0" placeholder="0">
                </div>
                <div class="form-field admin-span-2">
                    <label for="edit-club-logo-input">社團 Logo</label>
                    <div style="display:flex;align-items:flex-start;gap:1rem;flex-wrap:wrap;margin-top:0.25rem;">
                        <img id="edit-club-logo-preview" src="" alt="Logo 預覽"
                             style="display:none;width:80px;height:80px;object-fit:cover;border-radius:0.5rem;border:1px solid var(--border-color);">
                        <div>
                            <input type="file" id="edit-club-logo-input" accept="image/jpeg,image/png,image/gif,image/webp">
                            <small style="display:block;margin-top:0.25rem;color:var(--text-light);">JPG／PNG／GIF／WebP，上限 10MB</small>
                        </div>
                    </div>
                </div>
                <div class="form-field admin-span-2">
                    <label for="edit-description">社團介紹</label>
                    <textarea id="edit-description" rows="6" style="width:100%;resize:vertical;"></textarea>
                </div>
                <div class="form-actions admin-span-2">
                    <button type="submit" class="btn btn-primary">儲存變更</button>
                    <button type="button" class="btn btn-secondary" id="club-edit-cancel">取消</button>
                </div>
            </form>
        </div>
    </div>

    <div class="container club-list-page">
        <section class="card admin-panel">
            <div class="admin-panel-head">
                <h2>社團管理</h2>
                <span class="admin-panel-subtext">新增基礎社團名單與控管顯示狀態</span>
            </div>
            <form id="create-club-base-form" class="admin-form-grid">
                <div class="form-field">
                    <label for="new-club-code">社團代碼（必填）</label>
                    <input type="text" id="new-club-code" required />
                    <div id="err-new-club-code" class="field-error"></div>
                </div>
                <div class="form-field">
                    <label for="new-club-name">社團名稱（必填）</label>
                    <input type="text" id="new-club-name" required />
                    <div id="err-new-club-name" class="field-error"></div>
                </div>
                <div class="form-field">
                    <label for="new-club-category">社團類別（必填）</label>
                    <select id="new-club-category" required>
                        <option value="">請選擇社團類別</option>
                    </select>
                    <div id="err-new-club-category" class="field-error"></div>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">新增社團基礎名單</button>
                </div>
            </form>
            <div class="admin-table-controls">
                <div class="form-field">
                    <label for="clubs-search">關鍵字搜尋</label>
                    <input type="text" id="clubs-search" placeholder="社團代碼、社團名稱、狀態" />
                </div>
                <div class="form-field">
                    <label for="clubs-sort">欄位排序</label>
                    <select id="clubs-sort">
                        <option value="club_code_asc">社團代碼（A-Z）</option>
                        <option value="club_code_desc">社團代碼（Z-A）</option>
                        <option value="club_name_asc">社團名稱（A-Z）</option>
                        <option value="club_name_desc">社團名稱（Z-A）</option>
                        <option value="activity_status_asc">狀態</option>
                    </select>
                </div>
            </div>
            <div class="table-shell">
                <table class="table" id="clubs-table">
                    <thead>
                        <tr><th>社團代碼</th><th>社團名</th><th>社團類別</th><th>狀態</th><th>隱藏狀態</th><th>動作</th></tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
            <div class="admin-pagination" id="clubs-pagination"></div>
        </section>
    </div>

    <script src="../js/main.js?v=20260507"></script>
    <script src="../js/admin-clubs.js?v=20260528"></script>
    <footer>
        <p>&copy; 2026 社團活動資訊統整平台 - 打造最好的校園社團生態</p>
    </footer>
</body>
</html>
